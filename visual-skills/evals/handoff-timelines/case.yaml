name: handoff-timelines
expected_outcome: |
  An animation driven by the recorded spans and events that shows agents' working and waiting time on a shared clock, makes the planner's blocked time in the synchronous handoff visible, states the real wall times (about 120 s and 57 s), shows the late message in level 3 arriving after it could be read, and can be paused or replayed.
