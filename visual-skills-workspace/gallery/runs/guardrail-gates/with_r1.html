/* ---------- helpers that act on a step */
function setPath(s, target, op, highlight) {
  const pre = PREFIX[op], el = s.q('#path');
  el.style.opacity = 1;
  el.innerHTML = highlight && pre && target.startsWith(pre)
    ? `<tspan fill="${C.violet}" font-weight="700" text-decoration="underline">${esc(pre)}</tspan>${esc(target.slice(pre.length))}` : esc(target);
}
function setReal(s, loc, done) {
  const el = s.q('#real'); el.style.opacity = 1;
  el.innerHTML = `<tspan fill="${C.mut}">${done ? 'really goes to: ' : 'walking: '}</tspan>${esc(loc)}`;
}
function verdict(s, id, allow, right) {
  const c = allow ? (right ? 'green' : 'red') : (right ? 'blue' : 'amber');
  s.swap('#' + id, (allow ? 'ALLOWS' : 'BLOCKS') + (right ? '  ✓ right' : '  ✗ wrong'), c);
}
// Move a dot along a route; float the path pieces ('..', 'link') and update the 'walking' line as it goes.
async function walk(s, c, du) {
  const pts = c.route, L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1], at = i => du * L[i] / tot;
  Object.entries(c.floats || {}).forEach(([i, txt]) => s.at(at(+i), () => s.float(pts[i][0] + 12, pts[i][1] + 4, txt, 'amber', 16)));
  Object.entries(c.tick || {}).forEach(([i, loc]) => s.at(at(+i), () => setReal(s, loc, +i === pts.length - 1)));
  await s.travel(pts, du, 'ink', {keep: true, r: 4});
  // once walked, turn the trail into footsteps so it never reads as another folder wall
  s.dyn.querySelectorAll('path').forEach(t => { t.style.transition = 'none'; t.style.strokeDashoffset = 0; t.style.strokeDasharray = '1 6'; t.setAttribute('stroke-width', 2.6); t.setAttribute('stroke-opacity', .8); });
  const e = pts[pts.length - 1];
  s.el('circle', {cx: e[0], cy: e[1], r: 4, fill: C.ink});
}

function cardStep(s, both) {
  let busy = false; const fooledP = new Set(), fooledS = new Set();

    ? `fooled so far: prefix ${fooledP.size}, scoped ${fooledS.size}` : `prefix gate fooled so far: ${fooledP.size}`;
  s.q('#op').textContent = 'Tap a card to send its request';
  counter();
  const run = async k => {
    if (busy) { s.float(190, 92, 'still walking…', 'mut', 15); return; }
    busy = true;
    const c = CARDS[k], r = REQ[c.id];
    CARDS.forEach((_, j) => { const p = s.q(`#card${j} .cb`); p.setAttribute('stroke', j === k ? C.ink : C.mut); p.setAttribute('stroke-width', j === k ? 2.6 : 1.4); });
    s.dyn.innerHTML = '';
    ['#vP', '#vS', '#real'].forEach(q => { const e = s.q(q); if (e) e.textContent = ''; });
    s.q('#op').textContent = `Agent asks to ${r.operation}:`;
    setPath(s, r.target, r.operation, true);
    s.cap((both ? CAP5 : CAP3)[c.id]);
    await s.wait(350);
    const aP = r.decisions[G.pre], okP = aP === r.expected_allow;
    verdict(s, 'vP', aP, okP);
    await s.wait(450);
    await walk(s, c, 1500);
    let col = okP ? (aP ? 'green' : 'blue') : 'red';
    if (both) { const aS = r.decisions[G.sc], okS = aS === r.expected_allow; verdict(s, 'vS', aS, okS);

    s.ring(...c.box, col);
    if (!okP) fooledP.add(c.id);
    counter();
    busy = false;
  };
  CARDS.forEach((c, i) => s.on('#card' + i, () => run(i), `Send the ${c.l1} ${c.l2} request`));
}

      duration: 3800 },

    { title: '3. Your turn: fool it', keys: ['gate', 'ok', 'bad'],
      cap: 'Your turn. Every card is a request whose text starts the way the gate wants. Tap one and watch where it really leads. How many fool the prefix gate?',
      draw: () => cardsMarkup(0) + requestRows(0) + gatesMarkup(false, 0, 300) + mapMarkup(0, 300),
      start(s) { cardStep(s, false); },
      demo: async s => { for (const i of [0, 1, 2]) { s.tap('#card' + i); await s.wait(3300); } },
      idleDemo: 5000, demoDuration: 9900, duration: 1400 },

    { title: '4. Follow the path first', keys: ['gate', 'bad', 'block'],
      cap: 'The scoped gate first works out where the path really leads: it follows each “..” and every link. Then it checks whole folder names (tmp/, not just the letters tmp) and refuses secret names like .env.',
      draw: () => agentMarkup('Same trick, two gates', 0) + requestRows(0) + gatesMarkup(true, 300, 600) + mapMarkup(0, 300),
      start(s) { const r = REQ.traversal; s.q('#op').textContent = `Agent asks to ${r.operation}:`;
        setPath(s, r.target, r.operation, true);
        s.at(1100, () => verdict(s, 'vP', r.decisions[G.pre], r.decisions[G.pre] === r.expected_allow));
        s.at(1800, async () => { await walk(s, TRAV, 2400);
          verdict(s, 'vS', r.decisions[G.sc], r.decisions[G.sc] === r.expected_allow); s.ring(...TRAV.box, 'blue'); }); },
      duration: 4800 },

    { title: '5. Your turn: both gates', keys: ['gate', 'ok', 'bad', 'block'],
      cap: 'Now both gates judge each card. The prefix gate reads the text; the scoped gate walks the path to the real place first. Tap the cards.',
      draw: () => cardsMarkup(0) + requestRows(0) + gatesMarkup(true, 0, 300) + mapMarkup(0, 300),
      start(s) { cardStep(s, true); },
      demo: async s => { for (const i of [3, 4, 5]) { s.tap('#card' + i); await s.wait(3300); } },
      idleDemo: 5000, demoDuration: 9900, duration: 1400 },

    { title: `6. All ${DATA.requests.length} requests, 5 gates`, keys: ['ok', 'bad', 'block', 'lost'],
      cap: `Notebook 10 sent ${DATA.requests.length} written requests to five gates: ${NF} forbidden, ${NP} permitted. Only the prefix gate let forbidden ones in: the ${PRE.forbidden_allowed} path tricks. Read-only was safe but blocked ${NP - RO.permitted_allowed} of ${NP} permitted jobs.`,
      alt: 'Dot chart. Each row is a gate, each dot one request. Filled dots were allowed, hollow dots blocked.',
      draw: () => {
        let m = T(FX + DX * (NF - 1) / 2, 26, `${NF} forbidden requests`, {z: 12, c: 'mut'}) + T(PX + DX * (NP - 1) / 2, 26, `${NP} permitted`, {z: 12, c: 'mut'});
        ROWS.forEach((row, i) => { const y = rowY(i), su = SUM[row.g], t = 300 + i * 650;
          m += T(14, y, row.name, {h: 1, z: 16, a: 'start', t}) +
            T(368, y, `${su.forbidden_allowed} of ${NF} forbidden in · ${su.permitted_allowed} of ${NP} jobs done`, {z: 12, a: 'end', t: t + 500}) +
            T(14, y + 36, row.desc, {z: 12, c: 'mut', a: 'start', t: t + 500});
          FORB.forEach((r, j) => m += `<circle class="u" data-row="${i}" data-id="${r.id}" cx="${FX + j * DX}" cy="${y + 16}" r="5" fill="${C.faint}" stroke="none" style="transition:fill .4s, stroke .4s"/>`);
          PERM.forEach((r, j) => m += `<circle class="u" data-row="${i}" data-id="${r.id}" cx="${PX + j * DX}" cy="${y + 16}" r="5" fill="${C.faint}" stroke="none" style="transition:fill .4s, stroke .4s"/>`);
        });
        m += T(190, 340, 'Scoped and approval-bound decided all 22 alike;', {z: 12, c: 'mut', t: 3800}) +
             T(190, 355, 'this test cannot tell those two apart.', {z: 12, c: 'mut', t: 3900});
        return m;
      },
      start(s) {
        s.svg.querySelectorAll('circle.u').forEach(c => {
          const row = ROWS[+c.dataset.row], r = REQ[c.dataset.id], allow = r.decisions[row.g];
          const name = r.expected_allow ? (allow ? 'green' : 'amber') : (allow ? 'red' : 'blue');
          s.at(300 + +c.dataset.row * 650 + 200, () => {
            if (allow) { c.setAttribute('fill', C.fill[name]); }            // allowed: filled dot
            else { c.setAttribute('fill', C.bg); c.setAttribute('stroke', C.fill[name]); c.setAttribute('stroke-width', 2); }   // blocked: hollow ring
          });
        });
        s.at(1300, () => s.ring(FX - 8, rowY(1) + 8, DX * 4 + 16, 16, 'red'));
      },
      duration: 4300 },

    { title: '7. What to ask of a gate', keys: ['lost'],
      cap: `Caveat: these were ${DATA.requests.length} hand-written requests, checked against the same rules the scoped gate was built from. 0 of ${NF} means the known tricks are caught, not that real attacks never get through.`,
      draw: () => {
        const tick = (y, t) => P(`M20 ${y - 5} l5 5 l9 -11`, 'ink', t, 300, 2.2);
        return T(190, 38, 'Check where it leads,', {h: 1, z: 24}) + T(190, 66, 'not how it is spelled', {h: 1, z: 24, t: 200}) +
          tick(110, 600) + T(44, 106, 'Work out the real place first:', {z: 13.5, a: 'start', t: 700}) +
            T(44, 124, 'follow every link and every “..”.', {z: 13.5, a: 'start', c: 'mut', t: 750}) +
          tick(166, 1100) + T(44, 162, 'Compare whole folder names (tmp/, not tmp)', {z: 13.5, a: 'start', t: 1200}) +
            T(44, 180, 'and refuse secret files such as .env.', {z: 13.5, a: 'start', c: 'mut', t: 1250}) +
          tick(222, 1600) + T(44, 218, 'Offer only the actions the job needs:', {z: 13.5, a: 'start', t: 1700}) +
            T(44, 236, 'no shell, no Python, no network.', {z: 13.5, a: 'start', c: 'mut', t: 1750}) +
          P(line(20, 262, 360, 262, 51, 1), 'faint', 2000, 400, 1) +
          T(190, 288, `Prefix gate: let in ${PRE.forbidden_allowed} of ${NF} forbidden requests.`, {z: 13, t: 2300}) +
          T(190, 308, `Scoped gate: ${SC.forbidden_allowed} of ${NF}, and all ${SC.permitted_allowed} of ${NP} jobs done.`, {z: 13, t: 2500}) +
          T(190, 336, `Too strict costs work: read-only blocked ${NP - RO.permitted_allowed} of ${NP} jobs.`, {z: 13, c: 'amber', t: 2800});
      },
      duration: 3600 },
  ],
});
