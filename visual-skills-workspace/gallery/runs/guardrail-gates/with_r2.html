const LINK_CURVE = curve(171, 304, 252, 192, -.28);           // drawn shortcut: from the end of the label to /srv/shared
const childOf = (p, name) => Object.keys(N).find(k => N[k].parent === p && N[k].name === name);
const fullPath = k => { const a = []; while (k && k !== 'root') { a.unshift(N[k].name); k = N[k].parent; } return '/' + a.join('/'); };

// Walk a path the way the disk does: one folder at a time, entering links when met, '..' = up one folder.
function resolve(path) {
  const hops = []; let cur = 'root', off = 0;
  path.split('/').forEach(p => {
    const a = off; off += p.length + 1;
    if (!p || p === '.') return;
    const nxt = p === '..' ? (N[cur].parent || 'root') : childOf(cur, p);
    if (!nxt) throw new Error('no node for ' + p + ' in ' + path);
    hops.push({from: cur, to: nxt, a, b: a + p.length}); cur = nxt;
    if (N[cur].link) { hops.push({from: cur, to: N[cur].link, a, b: a + p.length, link: true}); cur = N[cur].link; }
  });
  return {hops, end: cur, path: fullPath(cur)};
}
function hopD(h) {
  if (h.link) { const L = N.link; return `M${L.x} ${L.y} L${L.x} 312 L171 312 L171 304 ` + LINK_CURVE.replace(/^M[^Q]*/, ''); }
  const down = N[h.to].parent === h.from, par = down ? N[h.from] : N[h.to], ch = down ? N[h.to] : N[h.from];
  let pts = (par === N.root && ch === N.srv) ? [[par.x, par.y], [par.x, 158], [ch.x, 158], [ch.x, ch.y]] : [[par.x, par.y], [par.x, ch.y], [ch.x, ch.y]];
  if (!down) pts = pts.reverse();
  return 'M' + pts.map(p => p.join(' ')).join(' L');
}
// What the safer gate (scoped capabilities) checks once it knows the real place (README section 2).
function saferReason(r, end) {
  const p = fullPath(end);
  if (!(p + '/').startsWith('/workspace/acme/')) return 'outside the project';
  if (SECRET_NAMES.includes(N[end].name)) return N[end].name + ' is on the secret list';
  if (r.op === 'delete' && !p.startsWith('/workspace/acme/tmp/')) return p.split('/')[3] + '/ is not tmp/';
  return null;
}
// Consistency checks: the drawing's own logic must agree with the recorded decisions.

  if ((saferReason(r, R.end) === null) !== allowedBy(r, 'scoped capabilities')) PROBLEMS.push('safer mismatch ' + r.id);
});
GATES.forEach(g => { const s = SUMMARY[g];
  const fa = REQ.filter(r => !r.ok && allowedBy(r, g)).length, pa = REQ.filter(r => r.ok && allowedBy(r, g)).length;

function setOp(s, op) { s.q('#op').innerHTML = `The agent asks to <tspan fill="${C.violet}" font-weight="600">${op}</tspan>:`; }
function setPath(s, str) { const t = s.q('#path'); t.innerHTML = [...str].map(ch => `<tspan>${K.esc(ch)}</tspan>`).join(''); s.fadeIn(t, 300); }
function put(s, sel, html, c) { const e = s.q(sel); e.style.transition = 'opacity .15s'; e.style.opacity = 0; s.at(160, () => { e.innerHTML = html; if (c) e.setAttribute('fill', K.col(c)); e.style.opacity = 1; }); }
function clearRun(s) { s.dyn.innerHTML = ''; }
function markNode(s, k, c) {
  const lb = s.q('#lb_' + k).getBBox(), n = N[k];
  const r = s.el('rect', {x: n.x - 7, y: lb.y - 3, width: lb.x + lb.width - n.x + 11, height: lb.height + 6, rx: 5, fill: 'none', stroke: K.col(c), 'stroke-width': 2});
  s.fadeIn(r, 300); return r;
}
async function walk(s, r, hop = 300) {
  const R = resolve(r.target), txt = s.q('#path');
  const dot = s.el('circle', {r: 4.4, fill: C.blue, cx: N.root.x, cy: N.root.y});
  for (const h of R.hops) {
    for (let i = h.a; i < h.b; i++) txt.children[i].setAttribute('fill', C.blue);
    const p = s.el('path', {d: hopD(h), fill: 'none', stroke: C.blue, 'stroke-width': 2, 'stroke-opacity': .75, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
    s.dyn.appendChild(dot);
    const L = p.getTotalLength(); p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L;
    await s.tween(h.link ? hop * 2.2 : hop, k => { const e = p.getPointAtLength(k * L); dot.setAttribute('cx', e.x.toFixed(1)); dot.setAttribute('cy', e.y.toFixed(1)); p.style.strokeDashoffset = L * (1 - k); });
  }
  return R;
}
// The prefix gate: compare the start of the text, say yes or no, then the request runs.
async function runPrefix(s, r, {skipIntro} = {}) {
  const rule = PREFIX[r.op], n = rule.length;
  if (!skipIntro) { setOp(s, r.op); setPath(s, r.target); put(s, '#gverd', ''); put(s, '#gl3', ''); put(s, '#gl2', 'Rule: the text must start with ' + mono(rule), 'mut'); await s.wait(700); }
  const txt = s.q('#path');
  await s.tween(700, k => { const m = Math.round(k * n); for (let i = 0; i < m; i++) txt.children[i].setAttribute('fill', C.green); }, {ease: 'linear'});
  const a = txt.getStartPositionOfChar(0).x, b = txt.getEndPositionOfChar(n - 1).x;
  const u = s.el('path', {d: line(a, 50, b, 50, 77, .5), fill: 'none', stroke: C.green, 'stroke-width': 1.8, 'stroke-linecap': 'round'}); s.drawIn(u, 350);
  const yes = allowedBy(r, 'lexical prefix');
  put(s, '#gl3', yes ? '✓ the first ' + n + ' letters match' : '✗ the start does not match', 'ink');
  await s.wait(600);
  put(s, '#gverd', yes ? 'says YES' : 'says NO', 'ink');
  await s.wait(700);
  const R = await walk(s, r);
  const good = r.ok, c = good ? 'green' : 'red';
  markNode(s, R.end, c);
  put(s, '#gl3', (good ? '✓ ' : '✗ ') + verb[r.op] + ' ' + mono(R.path) + (N[R.end].name === '.env' ? ', a secret' : ''), c);
  await s.wait(600);
  return R;
}
// The safer gate: first find the real place (follow links and ..), then check that place.
async function runSafer(s, r, hop = 210) {
  setOp(s, r.op); setPath(s, r.target); put(s, '#gverd', ''); put(s, '#gl3', '');
  put(s, '#gl2', 'First: where does this really lead?', 'mut');
  await s.wait(600);
  const R = await walk(s, r, hop);
  markNode(s, R.end, 'red');
  put(s, '#gl2', 'Really leads to ' + mono(R.path), 'ink');
  await s.wait(450);
  const why = saferReason(r, R.end);
  put(s, '#gl3', why ? '✗ ' + why : '✓ allowed', why ? 'red' : 'green');
  put(s, '#gverd', allowedBy(r, 'scoped capabilities') ? 'says YES' : 'says NO', 'ink');
  await s.wait(900);
  return R;
}
