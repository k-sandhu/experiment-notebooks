          readout('Chronos-2: off by ' + fmt(CH_MAE) + ' MW an hour', 'green',
            Math.round((1 - CH_MAE / NAIVE_MAE) * 100) + '% less than repeating last week; band held ' + CH_COVER + ' of 168 hours', 2400);
      },
      duration: 2900 },

    { title: '6. One week is one draw', keys: ['guess', 'naive', 'pre', 'fit'],
      cap: 'Rings: this week alone. Dots: the average over 20 Ontario forecasts (1 = the error of repeating last week). Every fitted method loses to it on average; the top four pretrained models cut it by about a third.',
      draw: () => {
        const R = K.scale(0.3, 2.4, 150, 362);
        const rows = Object.keys(DATA.ontario20).sort((a, b) => DATA.ontario20[a] - DATA.ontario20[b]);
        let m = T(14, 24, 'Ontario demand: error ÷ repeat last week', {a: 'start', z: 14, c: 'ink', w: 600});
        [0.5, 1, 1.5, 2].forEach(v => {
          m += `<line x1="${K.f(R(v))}" x2="${K.f(R(v))}" y1="52" y2="${66 + 12 * 19 + 8}" stroke="${K.col(v === 1 ? 'violet' : 'line')}" stroke-width="${v === 1 ? 1.2 : .6}" stroke-dasharray="${v === 1 ? '4 3' : '2 3'}"/>`;
          m += T(R(v), 46, v.toFixed(1), {z: 12, c: v === 1 ? 'violet' : 'mut'});
        });
        rows.forEach((name, i) => {
          const y = 66 + i * 19, t = typeOf(name);
          m += T(142, y + 4, NICE[name] || name, {a: 'end', z: 12.5, c: INK[t], t: 80 + i * 60});
          const wk = name === 'Seasonal naive' ? 1 : mae(DATA.forecasts[name]) / NAIVE_MAE;
          m += `<circle cx="${K.f(R(wk))}" cy="${y}" r="5" fill="none" stroke="${K.col(INK[t])}" stroke-width="1.4" data-k="fade" data-t="${200 + i * 60}" data-d="400"/>`;
          m += `<circle class="avg" data-i="${i}" data-from="${K.f(R(wk))}" data-to="${K.f(R(DATA.ontario20[name]))}" cx="${K.f(R(wk))}" cy="${y}" r="4.6" fill="${K.col(FILL[t])}" data-k="fade" data-t="1300" data-d="300"/>`;
          if (name === 'AutoARIMA') m += T(R(DATA.ontario20[name]) + 10, y + 4, f2(wk) + ' → ' + f2(DATA.ontario20[name]), {a: 'start', z: 12, c: 'blue', t: 3300});
        });
        const yy = 66 + 12 * 19 + 6;
        if (G.final) {
          const gr = mae(G.final) / NAIVE_MAE;
          m += T(142, yy + 4, guessName(), {a: 'end', z: 12.5, c: 'amber', t: 900});
          m += `<circle cx="${K.f(R(Math.min(gr, 2.4)))}" cy="${yy}" r="5" fill="none" stroke="${K.col('amber')}" stroke-width="1.4" stroke-dasharray="2 2" data-k="fade" data-t="900" data-d="400"/>`;
        }
        m += T(14, 324, '○ this week only (7-day error)', {a: 'start', z: 12, c: 'mut', t: 600});
        m += T(14, 342, '● average of 20 forecasts (24-hour and 7-day scores)', {a: 'start', z: 12, c: 'mut', t: 1300});
        return m;
      },
      start(s) {
        const dots = [...s.root.querySelectorAll('circle.avg')];
        s.tween(1500, k => dots.forEach(d => {
          const kk = K.clamp(k * 1.6 - (+d.dataset.i) * 0.05, 0, 1);
          d.setAttribute('cx', K.f(K.lerp(+d.dataset.from, +d.dataset.to, K.ease.inOut(kk))));
        }), {delay: 1800, ease: 'linear'});
      },
      duration: 3700 },

    { title: '7. Across six series', keys: ['naive', 'pre', 'fit'],
      cap: 'Averaged over all six series in the study, Chronos-2 made 14% less error than repeating the last cycle and AutoETS, the best fitted method, 4%. The top four sit so close that their order is not a finding.',
      draw: () => {
        const R = K.scale(0.6, 1.8, 150, 362), rows = DATA.headline512;
        let m = T(14, 24, 'Six series: error ÷ repeat last cycle', {a: 'start', z: 14, c: 'ink', w: 600});
        [0.8, 1, 1.2, 1.4, 1.6].forEach(v => {
          m += `<line x1="${K.f(R(v))}" x2="${K.f(R(v))}" y1="52" y2="${62 + 11 * 19 + 8}" stroke="${K.col(v === 1 ? 'violet' : 'line')}" stroke-width="${v === 1 ? 1.2 : .6}" stroke-dasharray="${v === 1 ? '4 3' : '2 3'}"/>`;
          m += T(R(v), 46, v.toFixed(1), {z: 12, c: v === 1 ? 'violet' : 'mut'});
        });
        rows.forEach((r, i) => {
          const y = 62 + i * 19, t = typeOf(r.model), tt = 150 + i * 90;
          m += T(142, y + 4, NICE[r.model] ? 'Repeat last cycle' : r.model, {a: 'end', z: 12.5, c: INK[t], t: tt});
          if (r.ci_high > r.ci_low) m += P(`M${K.f(R(r.ci_low))},${y}L${K.f(R(r.ci_high))},${y}`, INK[t], tt + 100, 400, 1.6);
          m += `<circle cx="${K.f(R(r.relative_mae))}" cy="${y}" r="4.6" fill="${K.col(FILL[t])}" data-k="fade" data-t="${tt + 300}" data-d="300"/>`;
        });
        const r3 = v => Math.round(v * 1000), top = rows.slice(0, 4), spread = (r3(top[3].relative_mae) - r3(top[0].relative_mae)) / 1000;
        m += P(`M246,57L251,57L251,${62 + 3 * 19 + 5}L246,${62 + 3 * 19 + 5}`, 'mut', 1500, 500, 1);
        m += T(258, 70, 'top four within', {a: 'start', z: 12, c: 'mut', t: 1800});
        m += T(258, 86, spread.toFixed(3) + ' of each other', {a: 'start', z: 12, c: 'mut', t: 1800});
        m += T(14, 300, 'dot: average of 6 series · line: 95% interval', {a: 'start', z: 12, c: 'mut', t: 2100});
        m += T(14, 318, 'Chronos-2 minus AutoETS: ' + PAIRED.diff.toFixed(3) + ' on average,', {a: 'start', z: 12, c: 'ink', t: 2400});
        m += T(14, 336, '95% interval ' + PAIRED.lo.toFixed(3) + ' to +' + PAIRED.hi.toFixed(3) + ': lead not established', {a: 'start', z: 12, c: 'ink', t: 2400});
        return m;
      },
      duration: 3000 },

    { title: '8. What to take away', keys: ['naive', 'pre', 'fit'],
      cap: 'Always score a forecast against repeating the last cycle. Pretrained models beat it clearly on series with a steady rhythm, not on those without one, and their 80% ranges held the truth only 65-70% of the time.',
      draw: () => {
        const R = K.scale(0.5, 1.3, 150, 362), S = DATA.bySeries;
        const groups = [
          {label: 'with a steady daily or weekly cycle', y: 86, rows: [['ontario_demand', 'Ontario demand'], ['toronto_temperature', 'Toronto temperature'], ['toronto_wind', 'Toronto wind'], ['wiki_toronto', 'Toronto page views']]},
          {label: 'without a dependable cycle', y: 196, rows: [['wiki_ai', 'AI page views'], ['usd_cad', 'USD/CAD rate']]},
        ];
        let m = T(14, 24, 'By series: error ÷ repeat last cycle', {a: 'start', z: 14, c: 'ink', w: 600});
        m += `<circle cx="20" cy="43" r="4.6" fill="${K.col(FILL.pre)}"/>` + T(30, 47, 'Chronos-2', {a: 'start', z: 12.5, c: 'green'});
        m += `<circle cx="112" cy="43" r="4.6" fill="${K.col(FILL.fit)}"/>` + T(122, 47, 'AutoETS (best fitted method)', {a: 'start', z: 12.5, c: 'blue'});
        [0.6, 0.8, 1, 1.2].forEach(v => {
          m += `<line x1="${K.f(R(v))}" x2="${K.f(R(v))}" y1="72" y2="244" stroke="${K.col(v === 1 ? 'violet' : 'line')}" stroke-width="${v === 1 ? 1.2 : .6}" stroke-dasharray="${v === 1 ? '4 3' : '2 3'}"/>`;
          m += T(R(v), 258, v.toFixed(1), {z: 12, c: v === 1 ? 'violet' : 'mut'});
        });
        m += T(R(1) - 4, 68, '← better', {a: 'end', z: 12, c: 'mut'}) + T(R(1) + 4, 68, 'worse →', {a: 'start', z: 12, c: 'mut'});
        let k = 0;
        groups.forEach((g, gi) => {
          m += T(14, g.y, g.label, {a: 'start', h: 1, z: 17, c: 'ink', t: gi * 1300});
          g.rows.forEach(([key, name], j) => {
            const y = g.y + 18 + j * 20, tt = gi * 1300 + 200 + j * 150, c = S['Chronos-2'][key], e = S['AutoETS'][key];
            m += T(142, y + 4, name, {a: 'end', z: 12.5, c: 'ink', t: tt});
            m += `<line x1="${K.f(R(c))}" x2="${K.f(R(e))}" y1="${y}" y2="${y}" stroke="${K.col('mut')}" stroke-width="1" data-k="fade" data-t="${tt}" data-d="300"/>`;
            m += `<circle cx="${K.f(R(e))}" cy="${y}" r="4.6" fill="${K.col(FILL.fit)}" data-k="fade" data-t="${tt + 100}" data-d="300"/>`;
            m += `<circle cx="${K.f(R(c))}" cy="${y}" r="4.6" fill="${K.col(FILL.pre)}" data-k="fade" data-t="${tt + 200}" data-d="300"/>`;
            k++;
          });
        });
        m += T(14, 290, 'Stated 80% ranges of the top four pretrained models', {a: 'start', z: 12.5, c: 'red', t: 2800});
        m += T(14, 308, 'held the real value only ' + COVER_RANGE + ' of the time.', {a: 'start', z: 12.5, c: 'red', t: 2800});
        return m;
      },
      duration: 3400 },
  ],
});

</script>
