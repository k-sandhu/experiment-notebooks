/* ---------- chart geometry: 14 days, 1 unit ~ 1 hour */
const X0 = 36, X1 = 366, YT = 48, YB = 206, MW0 = 12000, MW1 = 24000;

const Y = v => YB - (YB - YT) * (v - MW0) / (MW1 - MW0);

const pts = (vals, h0) => vals.map((v, i) => [X(h0 + i), Y(v)]);
const dOf = p => 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');

/* ---------- the reader's guess: 84 two-hour bins over the hidden week, kept across steps */
const NB = 84, NEED = Math.ceil(NB * 0.7);
const GUESS = {bins: Array(NB).fill(null), example: false};
const filled = () => GUESS.bins.filter(v => v != null).length;
function guessHourly() {            // interpolate missing bins, then hourly values between bin centres
  const b = GUESS.bins, idx = b.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
  if (!idx.length) return null;
  const full = b.map((v, i) => {
    if (v != null) return v;
    const lo = [...idx].reverse().find(j => j < i), hi = idx.find(j => j > i);
    if (lo == null) return b[hi]; if (hi == null) return b[lo];
    return K.lerp(b[lo], b[hi], (i - lo) / (hi - lo));
  });
  return Array.from({length: 168}, (_, h) => {
    const c = (h - 0.5) / 2, i = Math.floor(c);
    if (i < 0) return full[0]; if (i >= NB - 1) return full[NB - 1];
    return K.lerp(full[i], full[i + 1], c - i);
  });
}

}

}

          (g ? `<g opacity=".75"><path d="${guessD()}" fill="none" stroke="${C.amber}" stroke-width="1.8" stroke-linecap="round"/></g>` : '') +

          T(14, 26, `Copy too high in ${OVER} of 168 hours`, {a: 'start', c: 'blue', z: 12.5, t: 2000}) +
          scoreRows(ROWS4());
      },
      start(s) { growRows(s, ROWS4()); },
      duration: 3600 },

    { title: '5. A pretrained model tries', keys: ['real', 'you', 'copy', 'pre'],
      cap: `Chronos-2 was pretrained on many other series and shown only the last ${DATA.context_values} hourly numbers: no dates, no weather. It missed by ${int(CHR_MAE)} MW an hour, ${LESS}% less error than the copy.`,
      draw: () => {
        const band = dOf(pts(DATA.chronos_p90, 168)) + ' L' + pts(DATA.chronos_p10, 168).reverse().map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L') + ' Z';
        return axes() + histPath(0, 0) + copyPath(.35, 0) +
          (GUESS.bins.some(v => v != null) ? `<g opacity=".35"><path d="${guessD()}" fill="none" stroke="${C.amber}" stroke-width="1.6"/></g>` : '') +
          `<path d="${dOf(pts(ACT, 168))}" fill="none" stroke="${C.ink}" stroke-width="1.5"/>` +
          `<path d="${band}" fill="${C.fill.violet}" fill-opacity=".3" data-k="fade" data-t="1800" data-d="700"/>` +
          P(dOf(pts(CHR, 168)), 'violet', 300, 1500, 1.6) +
          T(14, 26, `Shaded 80% band held the real value in ${COVER} of 168 hours`, {a: 'start', c: 'violet', z: 12.5, t: 2300}) +
          scoreRows(ROWS5());
      },
      start(s) { growRows(s, ROWS5()); },
      duration: 3800 },

    { title: '6. One week is one draw', keys: ['copy', 'pre', 'fit'],
      cap: 'Error relative to the copy; below 1.0 beats it. In this one week, AutoARIMA (fitted) beat four of the five leading pretrained models. Tap All 20 forecasts to see the average over every Ontario forecast in the study.',
      draw: () => {
        const ms = Object.keys(ON20);
        let m = T(14, 22, 'This week only (Aug 20-26)', {a: 'start', id: 'mode', c: 'ink', z: 13, w: 600});
        m += `<line x1="${RX(1)}" x2="${RX(1)}" y1="38" y2="${52 + 20 * ms.length - 6}" stroke="${C.blue}" stroke-dasharray="3 3"/>`;
        m += T(RX(1) + 4, 40, '1.0 = copy', {a: 'start', c: 'blue', z: 12});
        ms.forEach((mth, k) => {
          const y = 58 + 20 * k, fam = FAM(mth);
          m += T(RX0 - 8, y + 4, NAME(mth), {a: 'end', c: fam === 'violet' ? 'ink' : fam, z: 12.5, t: 60 * k});
          m += `<rect id="rb${k}" x="${RX0}" y="${y - 6}" height="12" rx="2" width="0" fill="${C.fill[fam]}"/>`;
          m += `<text id="rv${k}" x="${RX0}" y="${y + 4}" font-size="12" fill="${C.ink}" style="font-variant-numeric:tabular-nums"></text>`;
        });
        m += T(14, 316, 'Rows sorted by the 20-forecast average.', {a: 'start', c: 'mut', z: 12});
        m += T(14, 332, '20-forecast scores average the 24 h and 168 h errors.', {a: 'start', c: 'mut', z: 12});
        return m;
      },
      start(s) {
        const ms = Object.keys(ON20);
        const vals = mode => ms.map(m => mode ? ON20[m] : MAE[m] / MAE['Seasonal naive']);
        let curv = ms.map(() => 0), mode = 0;
        const set = v => ms.forEach((m, k) => {
          const w = RX(v[k]) - RX0;
          s.q('#rb' + k).setAttribute('width', Math.max(0, w).toFixed(1));
          const t = s.q('#rv' + k); t.setAttribute('x', (RX0 + w + 4).toFixed(1)); t.textContent = r2(v[k]);
        });
        const go = (to, du) => { const from = curv.slice(), tv = vals(to); mode = to; return s.tween(du, k => { curv = from.map((f, i) => K.lerp(f, tv[i], k)); set(curv); }); };
        go(0, 1200).then(() => {});
        const b1 = s.btn('', 'This week', () => { if (mode) { b1.setAttribute('aria-pressed', 'true'); b2.setAttribute('aria-pressed', 'false'); s.swap('#mode', 'This week only (Aug 20-26)'); go(0, 1100); } });
        const b2 = s.btn('', 'All 20 forecasts', () => { if (!mode) { b2.setAttribute('aria-pressed', 'true'); b1.setAttribute('aria-pressed', 'false'); s.swap('#mode', 'Ontario, average of 20 forecasts'); go(1, 1100); } }, {primary: true});
        b1.setAttribute('aria-pressed', 'true'); b2.setAttribute('aria-pressed', 'false');
        s.b2 = b2;
      },
      demo: async s => { s.tap(s.b2); await s.wait(1500); },
      idleDemo: 4500, demoDuration: 1800, duration: 1800 },

    { title: '7. Beyond electricity', keys: ['pre', 'fit'],
      cap: 'Chronos-2 beat the copy on the four series with a steady daily or weekly rhythm and lost on USD/CAD and AI page views. Across all six it made 14% less error, with a wide range (0.75 to 0.97).',
      draw: () => {
        const BS = DATA.by_series, H = DATA.headline;
        const rows = [['ontario_demand', 'Ontario demand'], ['toronto_temperature', 'Toronto temperature'], ['toronto_wind', 'Toronto wind'],
          ['wiki_toronto', 'Toronto page views'], ['usd_cad', 'USD/CAD rate'], ['wiki_ai', 'AI page views']];
        let m = `<circle cx="20" cy="22" r="4.5" fill="${C.fill.violet}"/>` + T(30, 26, 'Chronos-2', {a: 'start', c: 'ink', z: 12.5}) +
          `<rect x="112" y="17.5" width="9" height="9" fill="${C.fill.green}"/>` + T(127, 26, 'AutoETS (best fitted)', {a: 'start', c: 'ink', z: 12.5});
        m += `<line x1="${DX(1)}" x2="${DX(1)}" y1="44" y2="292" stroke="${C.blue}" stroke-dasharray="3 3"/>` + T(DX(1) + 4, 48, '1.0 = copy', {a: 'start', c: 'blue', z: 12});
        [0.6, 0.8, 1.2].forEach(v => m += `<line x1="${DX(v)}" x2="${DX(v)}" y1="56" y2="292" stroke="${C.line}" stroke-width=".7"/>`);
        [0.6, 0.8, 1.0, 1.2].forEach(v => m += T(DX(v), 308, v.toFixed(1), {c: 'mut', z: 12}));
        m += T(DX(0.9), 326, 'error relative to the copy', {c: 'mut', z: 12});
        rows.forEach(([key, lab], k) => {
          const y = 70 + 30 * k, t = 200 + 150 * k;
          m += T(14, y + 4, lab, {a: 'start', c: 'ink', z: 12.5, t});
          m += `<line x1="${DX(BS['Chronos-2'][key])}" x2="${DX(BS.AutoETS[key])}" y1="${y}" y2="${y}" stroke="${C.faint}" data-k="fade" data-t="${t}" data-d="400"/>`;
          m += `<rect x="${DX(BS.AutoETS[key]) - 4.5}" y="${y - 4.5}" width="9" height="9" fill="${C.fill.green}" data-k="fade" data-t="${t + 100}" data-d="400"/>`;
          m += `<circle cx="${DX(BS['Chronos-2'][key])}" cy="${y}" r="5" fill="${C.fill.violet}" data-k="fade" data-t="${t + 100}" data-d="400"/>`;
        });
        const y = 266, c = H['Chronos-2'], a = H.AutoETS, t = 1300;
        m += `<line x1="14" x2="366" y1="250" y2="250" stroke="${C.line}"/>`;
        m += T(14, y + 4, 'Average of 6', {a: 'start', c: 'ink', z: 13, w: 600, t});
        m += `<line x1="${DX(c.ci_low)}" x2="${DX(c.ci_high)}" y1="${y}" y2="${y}" stroke="${C.violet}" stroke-width="2" data-k="fade" data-t="${t}" data-d="500"/>`;
        m += `<rect x="${DX(a.relative_mae) - 4.5}" y="${y - 4.5}" width="9" height="9" fill="${C.fill.green}" data-k="fade" data-t="${t + 200}" data-d="400"/>`;
        m += `<circle cx="${DX(c.relative_mae)}" cy="${y}" r="5.5" fill="${C.fill.violet}" data-k="fade" data-t="${t + 200}" data-d="400"/>`;
        m += T(DX(c.relative_mae), y + 20, r2(c.relative_mae), {c: 'violet', z: 12, t: t + 500});
        m += T(DX(1) + 4, y + 20, r2(a.relative_mae), {a: 'start', c: 'green', z: 12, t: t + 500});
        return m;
      },
      duration: 2400 },

    { title: '8. What to take from it', keys: [],
      cap: 'Before trusting a forecaster, score it against repeating the last cycle on many forecasts of your own series. Caveat: six series in one two-month window; the lead over AutoETS (0.86 vs 0.96) is not established.',
      draw: () => {
        const O = Object.values(ON20), pre = ['TiRex-2', 'Chronos-2', 'Toto 2', 'Moirai 2'].map(m => ON20[m]);
        const cards = [
          ['Always race the copy', 'Repeating last week beat every fitted method', `on Ontario demand (${r2(ON20.AutoETS)} to ${r2(ON20.Theta)}).`, 'blue'],
          ['Rhythm is where models win', `Top pretrained models: ${r2(Math.min(...pre))} to ${r2(Math.max(...pre))} on Ontario,`, 'about a third less error than the copy.', 'violet'],
          ['One week proves little', `This week AutoARIMA scored ${r2(MAE.AutoARIMA / MAE['Seasonal naive'])}; over 20`, `forecasts it scored ${r2(ON20.AutoARIMA)}. Judge on many.`, 'amber'],
        ];
        let m = '';
        cards.forEach(([h, a, b, c], k) => {
          const y = 18 + 106 * k, t = 500 * k;
          m += P(rect(14, y, 352, 92, 40 + k), c, t, 700, 1.4);
          m += T(28, y + 30, h, {h: 1, z: 21, a: 'start', c, t: t + 300});
          m += T(28, y + 56, a, {a: 'start', z: 12.5, t: t + 500});
          m += T(28, y + 75, b, {a: 'start', z: 12.5, t: t + 500});
        });
        return m;
      },
      duration: 2200 },
  ],
});

function ROWS4() {
  const g = guessHourly();
  return [{label: guessLabel(), v: g ? maeOf(g) : null, fill: 'amber', c: 'amber', t: 2300},
          {label: 'Repeat last week', v: NAIVE_MAE, fill: 'blue', c: 'blue', t: 2700}];
}
function ROWS5() {
  const g = guessHourly();
  return [{label: guessLabel(), v: g ? maeOf(g) : null, fill: 'amber', c: 'amber'},
          {label: 'Repeat last week', v: NAIVE_MAE, fill: 'blue', c: 'blue'},
          {label: 'Chronos-2', v: CHR_MAE, fill: 'violet', c: 'violet', t: 2200}];
}
