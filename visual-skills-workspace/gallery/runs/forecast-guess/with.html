      s.at(3500, () => { s.q('#verdict').textContent = v; s.fadeIn(s.q('#verdict'), 450); });
      s.btn('restart', 'Draw again', () => { GUESS = null; EX.go(2); });
    },
    duration: 4200 },

  { title: '5. A pretrained model tries', keys: ['actual', 'copy', 'pre'],
    cap: `Chronos-2 learned from many other series beforehand and was given only these numbers: no dates, no weather. Shaded: its 80% range, which held the actual in ${COVER} of 168 hours.`,
    draw: () =>
      T(12, 26, 'Chronos-2: off by', {z: 14, a: 'start', c: 'violet'}) +
      T(196, 26, '', {id: 'sc', z: 15, a: 'end', c: 'violet', w: 700}) + T(200, 26, 'MW an hour', {z: 14, a: 'start', c: 'violet'}) +
      T(12, 48, 'Copy last week: off by', {z: 14, a: 'start', c: 'blue'}) +
      T(196, 48, fmt(NAIVE_MAE), {z: 15, a: 'end', c: 'blue', w: 700}) + T(200, 48, 'MW an hour', {z: 14, a: 'start', c: 'blue'}) +
      T(12, 70, '', {id: 'verdict', h: 1, z: 17, a: 'start'}) +
      frameMarkup({hidden: false}) + histPlain() + dashed(DATA.naive, 'blue', .45) +
      F(DATA.chronosP90.map((v, i) => (i ? 'L' : 'M') + X(168 + i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') +
        DATA.chronosP10.map((v, i) => i).reverse().map(i => 'L' + X(168 + i).toFixed(1) + ' ' + Y(DATA.chronosP10[i]).toFixed(1)).join('') + 'Z', 'fill.violet', 300, {op: .38}) +
      `<path d="${pathOf(DATA.actual, 168)}" fill="none" stroke="${C.ink}" stroke-width="1.8" stroke-linejoin="round"/>` +
      P(pathOf(DATA.chronos, 168), 'violet', 700, 1500, 1.8),
    start(s) {
      s.at(2300, () => s.count('#sc', CHRONOS_MAE, {from: NAIVE_MAE, du: 900, fmt: fmt}));
      s.at(3400, () => { s.q('#verdict').textContent = `${Math.round((1 - CHRONOS_MAE / NAIVE_MAE) * 100)}% less error than copying last week`; s.fadeIn(s.q('#verdict'), 450); });
    },
    duration: 4000 },

  { title: '6. One week is one draw', keys: ['pre', 'copy', 'fit'],
    cap: CAP6[0],
    draw: () => {
      let m = T(12, 24, STATES[0].name, {id: 'st', h: 1, z: 19, a: 'start'}) +
        T(12, 44, 'bar = typical miss ÷ miss of copying last week', {z: 13, a: 'start', c: 'mut'});
      m += `<line x1="${BX(1)}" x2="${BX(1)}" y1="54" y2="${rowY(11) + 10}" stroke="${C.mut}" stroke-dasharray="3 3"/>`;
      ROWS.forEach(([name, kind], j) => {
        const y = rowY(j);
        m += T(116, y + 4.5, label(name), {z: 13, a: 'end', c: KIND[kind], t: 80 + j * 50});
        m += `<rect id="b${j}" x="${BX0}" y="${y - 5.5}" width="0" height="11" rx="1.5" fill="${C.fill[KIND[kind]]}"/>`;
        m += `<line id="w${j}" x1="${BX0}" x2="${BX0}" y1="${y}" y2="${y}" stroke="${C.ink}" stroke-width="1.3" opacity="0"/>`;
        m += `<text id="v${j}" x="${BX0 + 4}" y="${y + 4.5}" font-size="13" fill="${C.ink}" style="font-variant-numeric:tabular-nums"></text>`;
      });
      m += T(BX(1) - 5, 300, '← beats copying', {z: 13, a: 'end', c: 'mut'}) + T(BX(1) + 5, 300, 'loses to it →', {z: 13, a: 'start', c: 'mut'});
      return m;
    },
    start(s) {
      let cur = -1; const btns = [];
      const show = (k, du = 900) => {
        if (k === cur) return; const from = ROWS.map(([m]) => cur < 0 ? 0 : STATES[cur].v(m)); cur = k;
        btns.forEach((b, i) => b.className = i === k ? 'pri' : '');
        s.swap('#st', STATES[k].name); if (k || from.some(Boolean)) s.cap(CAP6[k]);
        const to = ROWS.map(([m]) => STATES[k].v(m)), ci = STATES[k].ci;
        ROWS.forEach(([m], j) => { const w = s.q('#w' + j); w.style.transition = 'opacity .4s';
          if (ci) { const [lo, hi] = ci(m); w.setAttribute('x1', BX(lo)); w.setAttribute('x2', BX(hi)); w.style.opacity = m === 'Seasonal naive' ? 0 : .9; } else w.style.opacity = 0; });
        s.tween(du, e => ROWS.forEach(([m], j) => {
          const v = K.lerp(from[j], to[j], e), r = s.q('#b' + j), t = s.q('#v' + j);
          r.setAttribute('width', Math.max(0, BX(v) - BX0).toFixed(1));
          const end = Math.max(BX(v), ci ? BX(ci(m)[1]) : 0);
          t.setAttribute('x', (end + 4).toFixed(1)); t.textContent = v.toFixed(2);
        }), {ease: 'inOut'});
      };
      STATES.forEach((st, k) => btns.push(s.btn('', ['This week', '20 starts', '6 series'][k], () => show(k))));
      s.at(900, () => show(0, 1100));
      s._show = show;
    },
    demo: async s => { s.tap(s.act.children[1]); await s.wait(3800); s.tap(s.act.children[2]); await s.wait(3800); },
    idleDemo: 6000, demoDuration: 7800, duration: 2400 },

  { title: '7. Where it helps', keys: ['pre', 'copy'],
    cap: 'Chronos-2 series by series: where demand, weather or page views repeat a daily or weekly cycle it beats copying. With no dependable cycle (AI page views, USD/CAD) copying the last cycle wins.',
    draw: () => {
      const S = [['Ontario power', 'ontario_demand'], ['Toronto temp.', 'toronto_temperature'], ['Toronto wind', 'toronto_wind'],
        ['Toronto views', 'wiki_toronto'], ['AI page views', 'wiki_ai'], ['USD/CAD', 'usd_cad']];
      let m = T(12, 24, 'Chronos-2, series by series', {h: 1, z: 19, a: 'start'}) +
        T(12, 44, 'miss ÷ miss of copying the last cycle', {z: 13, a: 'start', c: 'mut'});
      const ry = j => 78 + j * 30 + (j > 3 ? 14 : 0);
      m += `<line x1="${BX(1)}" x2="${BX(1)}" y1="60" y2="${ry(5) + 14}" stroke="${C.blue}" stroke-dasharray="3 3"/>`;
      m += T(BX(1), 296, 'copying = 1', {z: 13, c: 'blue'});
      S.forEach(([lab, key], j) => {
        const v = DATA.chronosBySeries[key], y = ry(j);
        m += T(116, y + 4.5, lab, {z: 13, a: 'end', c: 'ink', t: 100 + j * 120});
        m += F(`M${BX0} ${y - 7}H${BX(v).toFixed(1)}V${y + 7}H${BX0}Z`, 'fill.violet', 300 + j * 160, {op: .9});
        m += T(BX(v) + 5, y + 4.5, v.toFixed(2), {z: 13, a: 'start', t: 400 + j * 160});
      });
      m += P(`M262 ${ry(0) - 8}h5V${ry(3) + 8}h-5`, 'mut', 1500, 400, 1.2) + T(272, ry(1) + 20, 'steady cycle:', {z: 13, a: 'start', c: 'mut', t: 1700}) +
        T(272, ry(1) + 36, 'beats copying', {z: 13, a: 'start', c: 'mut', t: 1700});
      m += P(`M262 ${ry(4) - 8}h5V${ry(5) + 8}h-5`, 'mut', 1900, 300, 1.2) + T(272, ry(4) + 11, 'no steady', {z: 13, a: 'start', c: 'mut', t: 2100}) +
        T(272, ry(4) + 27, 'cycle: loses', {z: 13, a: 'start', c: 'mut', t: 2100});
      return m;
    },
    duration: 2800 },

  { title: '8. What to take away', keys: [],
    cap: 'Limits: six hand-picked series, one two-month window (Aug 20 to Oct 17, 2026) with overlapping forecast weeks, and no holiday or weather inputs for any method.',
    draw: () => {
      const items = [
        ['Score every forecast against copying the', 'last cycle. On Ontario power, all four', 'fitted methods lost to it.'],
        ['Steady cycles: the best pretrained models', 'missed a third less (Ontario, 0.64-0.68).'],
        [`Across six series: ${Math.round((1 - DATA.headline['Chronos-2'][0]) * 100)}% less (Chronos-2), not`, `clearly ahead of AutoETS (${Math.round((1 - DATA.headline.AutoETS[0]) * 100)}% less).`],
        ['Their 80% ranges held the actual only', '65.5-70.1% of the time: too narrow.'],
      ];
      let m = '', y = 34;
      items.forEach((lines, j) => {
        m += P(K.ellipse(24, y - 5, 10, 10, 40 + j), 'amber', 200 + j * 700, 400, 1.4) + T(24, y, String(j + 1), {h: 1, z: 17, c: 'amber', t: 300 + j * 700});
        lines.forEach((ln, k) => m += T(42, y + k * 19, ln, {z: 14.5, a: 'start', t: 350 + j * 700 + k * 120}));
        y += lines.length * 19 + 22;
      });
      m += T(42, 296, 'one week is one draw: judge on many', {h: 1, z: 16, a: 'start', c: 'mut', t: 3200});
      return m;
    },
    duration: 3800 },
];

async function fillExample(s, g, redraw) {
  GUESS_IS_EXAMPLE = true;
  await s.tween(1600, k => { const n = Math.round(k * N); for (let i = 0; i < n; i++) g[i] = EXAMPLE[i]; redraw(); }, {ease: 'linear'});
  GUESS_IS_EXAMPLE = true;
  s.cap('Example guess: last week\'s average day, repeated seven times (illustrative, not a model). Tap Reveal to see the real week.');
}
