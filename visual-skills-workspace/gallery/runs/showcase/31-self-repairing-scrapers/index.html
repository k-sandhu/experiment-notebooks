function cellAttrs(code) {

}

          m += T(310, y + 30, pct, {z: 12, a: 'start', c: 'ink', t: 900 + i * 100});
        });
        m += T(12, 428, 'Bars: share right. Costs: model calls, list prices.', {z: 12, a: 'start', c: 'mut', t: 1600});

      },
