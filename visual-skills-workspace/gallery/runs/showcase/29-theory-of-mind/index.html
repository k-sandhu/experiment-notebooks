    P(poly([[x - 10, y - 10], [x, y - 17], [x + 10, y - 10]], seed + 3), c, t + 300, 300, 1.8);

/* A belief bubble. */
function bubble(id, x, y, text, c, t, seed, hidden) {

    P(ellipse(x, y, 50, 19, seed), c, t, 500, 1.6) +
