        s += T(110, 336, '6,570 numbers', {z: 13, c: 'mut', t: 2600});
        s += T(190, 370, 'numbered retry, same design: 1,214 right', {z: 13, c: 'violet', w: 700, t: 3300});
        return s;
      },
      start(s) { s.fadeIn('#colA', 600, 200); s.fadeIn('#colB', 600, 600); },
      duration: 3800 },

    { title: '7. It ran, but one digit wins', keys: ['right'],
      cap: 'GLM-5.3’s network ran, but its ten digit scores sat on different scales, so “0” won almost every image. Weights written as text can work (91.5% at best), but only if the list is complete and the scores are balanced.',
      draw: () => {
        const X0 = 54, BWd = 22, GAP = 7.5, YB = 236, YT = 70, MAX = 1797;
        const yv = v => YB - (YB - YT) * v / MAX;
        let s = T(190, 34, 'what GLM-5.3’s network answered', {h: 1, z: 18});
        s += T(190, 54, 'for the 1,797 test digits', {z: 12, c: 'mut'});
        s += `<line x1="${X0 - 6}" x2="${X0 + 10 * (BWd + GAP)}" y1="${YB}" y2="${YB}" stroke="${C.mut}"/>`;
        DATA.glmPred.forEach((v, d) => {
          const x = X0 + d * (BWd + GAP), r = DATA.glmRight[d];
          if (v) {
            s += `<rect class="gb" x="${x}" y="${yv(v)}" width="${BWd}" height="${YB - yv(v)}" fill="${C.faint}" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)"/>`;
            s += `<rect class="gb" x="${x}" y="${yv(r)}" width="${BWd}" height="${YB - yv(r)}" fill="${C.fill.blue}" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)"/>`;
            s += v > 400 ? T(x + BWd / 2, yv(v) - 6, fmt(v), {z: 12, w: 700, t: 1300}) : T(x + BWd + 3, yv(v) + 10, fmt(v), {z: 12, w: 700, a: 'start', t: 1300});
          }
          s += T(x + BWd / 2, YB + 16, String(d), {z: 13, c: 'mut', t: 200});
        });
        const yr = yv(180);
        s += `<line id="even" x1="${X0 - 6}" x2="${X0 + 10 * (BWd + GAP)}" y1="${yr}" y2="${yr}" stroke="${C.ink}" stroke-width="1.2" stroke-dasharray="4 3" style="opacity:0;transition:opacity .5s"/>`;
        s += T(X0 + 10 * (BWd + GAP) - 4, yr - 6, 'real count: about 180 per digit', {z: 12, a: 'end', c: 'ink', t: 2100});
        s += T(X0 + BWd + 6, YB - 4, '← 178 right', {z: 12, a: 'start', c: 'blue', t: 1800});
        s += T(190, YB + 36, 'digit answered', {z: 12, c: 'mut', t: 300});
        s += T(24, 300, `DeepSeek V4.1 Flash said “1” for ${fmt(DATA.deepseekOnes)}`, {z: 13, a: 'start', t: 2600});
        s += T(24, 320, `MiMo-V2.6-Pro said “1” for ${fmt(DATA.mimoOnes)}`, {z: 13, a: 'start', t: 2800});
        s += T(190, 356, 'check the count, then the idea', {h: 1, z: 22, t: 3300});
        s += T(190, 384, 'one network per model, on 1998 data: not a ranking', {z: 12, c: 'mut', t: 3600});
        return s;
      },
      start(s) {
        s.svg.querySelectorAll('.gb').forEach((e, j) => s.at(400 + j * 120, () => s.bar(e, 1, 800, 'y')));
        s.at(2000, () => { s.q('#even').style.opacity = .8; });
      },
      duration: 3900 },
  ],
});
