    const x = XB(lateInstr.t), y = LANE_B[3] - 10, lost = now >= lateResult.t;
    const c = lost ? C.red : C.blue;
    m += `<rect x="${x - 7}" y="${y - 10}" width="14" height="10" rx="1.5" fill="${C.bg}" stroke="${c}" stroke-width="1.5"/><path d="M${x - 7} ${y - 10} L${x} ${y - 4} L${x + 7} ${y - 10}" fill="none" stroke="${c}" stroke-width="1.3"/>`;
    const lw = lost ? 80 : 70; m += `<rect x="${x - 13 - lw}" y="${y - 12}" width="${lw + 2}" height="15" rx="3" fill="${C.bg}"/>`;
    m += T(x - 11, y - 1, lost ? '✗ never read' : 'instruction', {a: 'end', z: 13, c: lost ? 'red' : 'blue', w: 700});
  }
  // callouts under the axis, in the order they happen
  const L = [];
  if (now >= lateLastStep.start) L.push([`Prague's last step starts at ${r1(lateLastStep.start)} s`, 'ink']);
  if (now >= lateInstr.t) L.push([`planner's instruction arrives at ${r1(lateInstr.t)} s`, 'blue']);
  if (now >= lateResult.t) L.push([`helper answers at ${r1(lateResult.t)} s: instruction unread`, 'red']);
  L.forEach(([s, c], i) => { m += T(14, 234 + i * 20, s, {a: 'start', z: 14, c, w: i === 2 ? 700 : 400}); });
  m += `<line x1="${XB(now)}" x2="${XB(now)}" y1="40" y2="190" stroke="${C.ink}" stroke-opacity=".55" stroke-width="1"/>`;
  return m;
}

const ROWS = [['L0_single_agent', 'One agent alone'], ['L1_sync_handoff', 'Sync handoff'], ['L2_async_spawn', 'Async spawn'],
  ['L3_progress_and_redirect', 'Progress reports'], ['L4_child_asks_parent', 'Helper asks back'], ['L5_race_and_cancel', 'Race, cancel 2 *'], ['L6_nested', 'Nested helpers']];
const SUM = ROWS.map(([lv, label]) => { const R = RUN[lv];
  return {lv, label, wall: R.wall_s, llm: busy(R, 'main', 'llm'), tool: busy(R, 'main', 'tool'), wait: busy(R, 'main', 'blocked'), correct: R.correct}; });
console.log('summary', SUM.map(s => [s.lv, s.wall, r1(s.llm + s.tool + s.wait), r1(s.wait)]));

function frameC(t) {
  const k = clamp((t - phaseStart('C') - 300) / 1800), XC = v => 134 + v * 1.6;
  let m = T(14, 24, 'Same task, 7 ways to coordinate', {h: 1, z: 18, a: 'start'});
  m += T(134, 46, "planner's time, start to answer", {a: 'start', z: 13, c: 'mut'});
  SUM.forEach((s, i) => {
    const y = 66 + i * 27, hi = s.lv === 'L1_sync_handoff' || s.lv === 'L2_async_spawn', op = hi ? 1 : .55;
    m += T(14, y + 4.5, s.label, {a: 'start', z: 13, c: hi ? 'ink' : 'mut', w: hi ? 700 : 400});
    let x = XC(0); const end = s.wall * k;
    [[s.llm, C.fill.violet], [s.tool, C.fill.green], [s.wait, 'url(#hatch)']].reduce((acc, [v, fill]) => {
      const a = Math.min(acc, end), b = Math.min(acc + v, end);
      if (b > a) m += box(XC(a), y - 7, XC(b) - XC(a), 14, fill, `opacity="${op}"`);
      return acc + v; }, 0);
    if (k >= 1) {
      m += T(XC(s.wall) + 5, y + 4.5, r0(s.wall) + ' s', {a: 'start', z: 13, c: hi ? 'ink' : 'mut', w: hi ? 700 : 400});
      if (s.wait > 30) m += `<rect x="${XC(s.llm + s.tool + s.wait / 2) - 34}" y="${y - 6}" width="68" height="12" rx="3" fill="${C.bg}" fill-opacity=".85"/>` + T(XC(s.llm + s.tool + s.wait / 2), y + 4, `waited ${r0(s.wait)} s`, {h: 1, z: 13, c: 'amber', w: 700});
    }
  });
  m += T(14, 270, '* smaller task: flights only', {a: 'start', z: 13, c: 'mut'});
  m += T(14, 289, `one run each · ${SUM.filter(s => s.correct).length} of 7 answers correct`, {a: 'start', z: 13, c: 'mut'});
  return m;
}

/* ---------- log: the same events in words ---------- */
const LOG = [];
const lg = (ph, r, text, c) => LOG.push({t: animAt(ph, r), text: r1(r).padStart(5) + ' ' + text, c});
SYNC.events.forEach(e => {
  const city = NAME[e.from === 'main' ? e.to : e.from];
  if (e.kind === 'spawn') lg('A', e.t, `sync  → ${city} helper; planner waits`, 'amber');
  if (e.kind === 'result') { const w = SYNC.spans.find(s => s.agent === 'main' && s.kind === 'blocked' && Math.abs(s.end - e.t) < .05);
    lg('A', e.t, `sync  ← ${city}, after ${r1(w.end - w.start)} s wait`, 'blue'); }
});
lg('A', syncFlights, 'sync  • planner starts flight searches', 'green');
lg('A', SYNC.wall_s, `sync  ✓ final answer at ${r1(SYNC.wall_s)} s`, 'ink');
ASYNC.events.forEach(e => {
  const city = NAME[e.from === 'main' ? e.to : e.from];
  if (e.kind === 'spawn') lg('A', e.t, `async → start ${city} helper`, 'blue');
  if (e.kind === 'result') lg('A', e.t, `async ← ${city} answer, planner busy`, 'blue');
});
lg('A', span(ASYNC, 'main', 'tool', 'search_flights').start, 'async • planner searches flights', 'green');
lg('A', 43.94, 'async • collects 3 answers: no wait', 'mut');     // wait_all at 43.9 s returned at once (facts.md)
lg('A', ASYNC.wall_s, `async ✓ final answer at ${r1(ASYNC.wall_s)} s`, 'ink');
LOG.push({t: phaseStart('B') + 1, text: '  ··· progress-report run ···', c: 'mut'});
lg('B', lateFail.end, 'Prague ✗ hotel search failed (503)', 'red');
lg('B', lateBackup.start, 'Prague • tries the backup search', 'green');
lg('B', lateAlert.t, 'Prague → planner: urgent report', 'red');
lg('B', lateLastStep.start, 'Prague • starts its last step', 'violet');
lg('B', lateInstr.t, 'planner → Prague: "use the backup data"', 'blue');
lg('B', lateResult.t, 'Prague ← answer; instruction unread ✗', 'red');
LOG.push({t: phaseStart('C') + 1, text: '  ··· all seven runs ···', c: 'mut'});
LOG.sort((a, b) => a.t - b.t);

const cap = [
  `Two recorded runs of one task: a planner and three city helpers plan a 3-city trip. Each bar is a recorded model call (violet) or search (green), on one shared clock.`,
  `Sync: the planner hands Lisbon to a helper and stops (amber stripes) until it answers. Async: it starts all three helpers by ${r0(asyncLastSpawn)} s and carries on.`,
  `Async: the planner searches flights while helpers find hotels. Their answers land at ${asyncAnswers.map(r0).join(', ')} s, while it is still busy. It never waits and finishes at ${r1(ASYNC.wall_s)} s.`,
  `Sync gets Rome back at ${r1(syncRome)} s, Prague at ${r1(syncPrague)} s, and only then searches flights. It waited ${r1(syncBlocked)} of ${r1(SYNC.wall_s)} s (${Math.round(syncBlocked / SYNC.wall_s * 100)}%): slower than one agent alone.`,
  `Another recorded run, zoomed in. Prague's hotel search fails (HTTP 503); the helper switches to a backup search and sends an urgent report at ${r1(lateAlert.t)} s.`,
  `Each helper step is a fresh model call. Prague's last began at ${r1(lateLastStep.start)} s, so the instruction sent at ${r1(lateInstr.t)} s was never read, and nobody told the planner. Harmless here: the backup was already used.`,
  `Wall-clock is the planner's own work plus its waiting; helpers only cost time when the planner waits. One recorded run per pattern, so gaps of a few seconds may not repeat.`,
];

K.player({
  root: '#x', style: 'chalkboard', viewBox: [380, 300], duration: DUR,
  title: 'Replay of recorded agent timelines from notebook 07: a sync handoff finishes in 120 s because the planner waits 66 s for helpers one at a time; an async spawn finishes in 57 s without waiting; one late instruction is never read.',
  legend: [{key: 'llm', label: 'model call', color: 'fill.violet'}, {key: 'tool', label: 'search', color: 'fill.green'},
           {key: 'wait', label: 'planner waiting', color: 'fill.amber'}, {key: 'msg', label: 'message', color: 'blue'},
           {key: 'fail', label: 'failed / unread', color: 'red'}],
  chapters: [
    {at: CH[0], title: '1. Same trip, two ways', cap: cap[0], keys: ['llm', 'tool']},
    {at: CH[1], title: '2. Hand off, or start all', cap: cap[1], keys: ['llm', 'tool', 'wait', 'msg']},
    {at: CH[2], title: '3. Work while helpers work', cap: cap[2], keys: ['llm', 'tool', 'wait', 'msg']},
    {at: CH[3], title: '4. Waiting, one by one', cap: cap[3], keys: ['llm', 'tool', 'wait', 'msg']},
    {at: CH[4], title: '5. A helper hits an error', cap: cap[4], keys: ['llm', 'tool', 'msg', 'fail']},
    {at: CH[5], title: '6. The reply nobody read', cap: cap[5], keys: ['llm', 'tool', 'msg', 'fail']},
    {at: CH[6], title: '7. All seven runs', cap: cap[6], keys: ['llm', 'tool', 'wait']},
  ],
  log: LOG,
  clock: t => { const p = at(t); return p.ph === 'A' ? `${r1(p.r)} s · 8× speed` : p.ph === 'B' ? `${r1(p.r)} s · 4× speed` : 'summary'; },
  scene,
  frame(t, s) {
    const p = at(t);
    s.q('#gA').style.display = p.ph === 'A' ? '' : 'none';
    s.dyn.innerHTML = p.ph === 'A' ? frameA(t, p.r) : p.ph === 'B' ? frameB(t, p.r) : frameC(t);
  },
});
