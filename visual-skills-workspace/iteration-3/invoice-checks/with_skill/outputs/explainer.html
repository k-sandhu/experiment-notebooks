  m += `<rect x="62" y="52" width="294" height="${(z - 52).toFixed(1)}" fill="${C.fill.green}" fill-opacity=".07"/>`;
  m += `<rect x="62" y="${z.toFixed(1)}" width="294" height="${(196 - z).toFixed(1)}" fill="${C.fill.red}" fill-opacity=".07"/>`;
  m += T(66, 66, 'check saves money', {a: 'start', z: 13, c: 'green', t: t0 + 200});
  m += T(352, 190, 'check costs extra', {a: 'end', z: 13, c: 'red', t: t0 + 200});
  ticks.forEach((v, i) => { m += `<line x1="62" x2="356" y1="${CY(v)}" y2="${CY(v)}" stroke="${C.faint}" stroke-width="${v ? .6 : 0}"/>`;
    m += T(56, CY(v) + 4.5, '', {a: 'end', z: 13, c: 'mut', id: 'yt' + i, t: t0}); });
  m += P(line(62, z, 356, z, 1), 'ink', t0, 500, 2);
  m += T(352, z + 15, 'Expensive only', {a: 'end', z: 13, c: 'ink', t: t0 + 300});
  [0, 0.1, 0.2, 0.3].forEach(v => { m += T(CX(v), 213, v ? '$' + v.toFixed(2) : '$0', {z: 13, c: 'mut', t: t0}); });
  m += T(209, 230, 'price of one expensive call (assumed)', {z: 13, c: 'mut', t: t0 + 100});
  m += T(12, 38, 'monthly saving vs expensive only', {a: 'start', z: 13, c: 'mut', t: t0});
  return m;
}
function routeLine(k, t) {
  const pts = [0, 0.3].map(g => [CX(g), CY(saveAt(k, g))]);
  return P(line(pts[0][0], pts[0][1], pts[1][0], pts[1][1], 3), ROUTE_COL[k], t, 900, 2.6, `id="ln-${k}"`);
}

function setTicks(s, v) { [-0.02, 0, 0.02, 0.04, 0.06].forEach((y, i) => { const e = s.q('#yt' + i); if (e) e.textContent = kfmt(y * v); }); }

/* price marker: vertical line plus a dot and value on each check line */
function marker(s) {
  const g = s.el('g', {});
  const ln = s.el('line', {y1: 52, y2: 196, stroke: C.mut, 'stroke-width': 1.2, 'stroke-dasharray': '3 3'}, g);
  const d = {}, lb = {};
  ['twice', 'claude'].forEach(k => { d[k] = s.el('circle', {r: 4.5, fill: C[ROUTE_COL[k]], stroke: C.bg, 'stroke-width': 1.5}, g);
    lb[k] = s.el('text', {'font-size': 13, 'font-weight': 600, fill: C[ROUTE_COL[k]], style: 'font-variant-numeric:tabular-nums'}, g); });
  return (gp, v) => {
    const x = CX(gp); ln.setAttribute('x1', x); ln.setAttribute('x2', x);
    const ys = {};
    ['twice', 'claude'].forEach(k => { ys[k] = CY(clamp(saveAt(k, gp), YLO, YHI)); d[k].setAttribute('cx', x); d[k].setAttribute('cy', ys[k]); });
    // Ask twice: above-left of its dot (below-right near the y axis); Claude: below-right (above-left near the right edge).
    // Both lines rise to the right, so these corners stay clear of the line itself.
    // Flip sides where a marker label would sit on a fixed line label (Ask twice ~x 245-300, Claude review ~x 271-356).
    const pos = {twice: x < 110 || (x >= 230 && x <= 320) ? 'br' : 'al', claude: x > 200 ? 'al' : 'br'};
    const place = (k, side) => { const br = side === 'br';
      lb[k].setAttribute('x', br ? x + 8 : x - 8); lb[k].setAttribute('text-anchor', br ? 'start' : 'end');
      lb[k].setAttribute('y', br ? ys[k] + 17 : ys[k] - 7); };
    // fixed chart texts: if a value label would sit on one, try the other side; failing that, dim the fixed text
    const fixed = [...g.ownerSVGElement.querySelectorAll('text')].filter(t => !g.contains(t) && t.textContent.trim());
    fixed.forEach(t => { if (t.dataset.dim) { t.style.opacity = 1; delete t.dataset.dim; } });
    const hits = e => { const A = e.getBBox(); return fixed.filter(t => { const B = t.getBBox();
      return A.x < B.x + B.width - 1 && B.x < A.x + A.width - 1 && A.y < B.y + B.height - 1 && B.y < A.y + A.height - 1; }); };
    ['twice', 'claude'].forEach(k => { const sv = v * saveAt(k, gp);
      lb[k].textContent = (sv >= 0 ? '+' : '') + money(sv); place(k, pos[k]);
      if (hits(lb[k]).length) { const alt = pos[k] === 'br' ? 'al' : 'br'; place(k, alt);
        const bb = lb[k].getBBox();
        if (hits(lb[k]).length || bb.x < 62 || bb.x + bb.width > 368) place(k, pos[k]); }
      hits(lb[k]).forEach(t => { t.style.transition = 'opacity .12s'; t.style.opacity = .12; t.dataset.dim = 1; }); });
  };
}

/* monthly bill bars (steps 4 and 6). rows = y baselines; returns update(g, v) */
function bills(s, y0, gap, x0, x1, big) {
  const rows = {};
  ROUTE_KEYS.forEach((k, i) => { const y = y0 + i * gap, c = ROUTE_COL[k];
    const nm = s.el('text', {x: 12, y: y + 4.5, 'font-size': big ? 14 : 13, 'font-weight': 600, fill: C[c]});
    nm.textContent = DATA.routes[k].name;
    const chk = s.el('rect', {x: x0, y: y - 7, height: 14, width: 0, fill: C.fill.red, 'fill-opacity': .9});
    const cal = s.el('rect', {x: x0, y: y - 7, height: 14, width: 0, fill: C[c], 'fill-opacity': .85});
    const val = s.el('text', {x: 368, y: y + 4.5, 'text-anchor': 'end', 'font-size': big ? 14 : 13, 'font-weight': 600, fill: C.ink, style: 'font-variant-numeric:tabular-nums'});
    const sub = big ? s.el('text', {x: 12, y: y + 24, 'font-size': 13, fill: C.mut, style: 'font-variant-numeric:tabular-nums'}) : null;
    rows[k] = {chk, cal, val, sub};
  });
  return (g, v, k01 = 1) => {
    const m = model(g, v), mx = Math.max(...ROUTE_KEYS.map(k => m[k].total)) || 1, W = x1 - x0;
    ROUTE_KEYS.forEach(k => { const r = rows[k], wc = W * m[k].check / mx * k01, wg = W * m[k].calls / mx * k01;
      r.chk.setAttribute('width', Math.max(0, wc)); r.cal.setAttribute('x', x0 + wc); r.cal.setAttribute('width', Math.max(0, wg));
      r.val.textContent = (m.best === k ? '✓ ' : '') + money(m[k].total);
      if (r.sub) r.sub.textContent = count(m[k].n) + ' expensive calls ' + money(m[k].calls) + (m[k].check ? ' + checks ' + money(m[k].check) : '');
    });
    return m;
  };
}
function verdict(m, g) {
  const b = m.best, nm = DATA.routes[b].name;
  const l1 = `Cheapest at ${price(g)} a call: ${nm}, ${money(m[b].total)} a month`;
  const l2 = b === 'only' ? 'Both checks cost more than the calls they save.' : `It saves ${money(m.saving[b])} a month vs Expensive only.`;
  return [l1, l2];
}
