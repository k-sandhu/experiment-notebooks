         `<path d="M${xa - 3} ${y2 + (down ? -4 : 4)} L${xa} ${y2} L${xa + 3} ${y2 + (down ? -4 : 4)}" fill="none" stroke="${c}" stroke-width="1.3"/>`;
    const k = (now - e.t) / 1.2;            // a dot runs along the arrow for 1.2 s of run time after it is sent
    if (k < 1) h += `<circle cx="${xa}" cy="${lerp(y1, y2, k)}" r="3.2" fill="${c}"/>`;
  });
  return h;
}
function nowLine(P, x, now) { return `<line x1="${x(now)}" x2="${x(now)}" y1="${P.lanes[0] - 10}" y2="${P.lanes[3] + 10}" stroke="${C.ink}" stroke-opacity=".55" stroke-width="1"/>`; }
function waitLabels(run, now, P) {   // the length of each finished wait, above the planner lane
  return blockedSpans(run).filter(b => b.end <= now).map(b => txt(X((b.start + b.end) / 2), P.wl, s1(b.end - b.start) + ' s', {z: 13, c: 'amber'})).join('');
}
function panel(run, now, P, name, o = {}) {
  const waited = blockedSpans(run).reduce((a, b) => a + Math.max(0, tclip(now, b.start, b.end) - b.start), 0);
  const done = now >= run.wall_s;
  let h = `<g opacity="${o.dim ? .4 : 1}">` + txt(12, P.title, name, {h: 1, z: 18, a: 'start'}) + laneLabels(run, P) + grid(P, X, [30, 60, 90, 120]);
  h += txt(368, P.title, 'planner waited ' + s1(waited) + ' s' + (done ? ' (' + Math.round(100 * blockedSum(run) / run.wall_s) + '%)' : ''), {a: 'end', z: 14, c: waited > 0 ? 'amber' : 'mut'});
  h += bars(run, now, P, X) + waitLabels(run, now, P);
  if (!done && now > 0 && !o.dim) h += nowLine(P, X, now);
  if (done) h += txt(X(run.wall_s) + 4, P.lanes[0] + 4.5, '✓', {a: 'start', z: 13, c: 'green'});
  if (o.sum) h += o.sum;
  else if (done) h += txt(76, P.sum, '✓ final answer at ' + s1(run.wall_s) + ' s (correct)', {a: 'start', z: 13, c: 'green'});
  return h + '</g>';
}
function axis(x, ticks, y, unitLast) {
  let h = `<line x1="${x(0)}" x2="${x(ticks[ticks.length - 1])}" y1="${y}" y2="${y}" stroke="${C.mut}" stroke-width="1"/>`;
  ticks.forEach((v, i) => { h += `<line x1="${x(v)}" x2="${x(v)}" y1="${y}" y2="${y + 4}" stroke="${C.mut}"/>` + txt(x(v), y + 17, v + (i === ticks.length - 1 ? unitLast : ''), {z: 13, c: 'mut'}); });
  return h;
}
const sumLine = (run, P) => txt(76, P.sum, s1(ownWork(run)) + ' s working + ' + s1(blockedSum(run)) + ' s waiting = ' + s1(run.wall_s) + ' s', {a: 'start', z: 13, c: 'ink'});

/* ---- the lost message (progress + redirect run) */
const PRAGUE = 'city_researcher#4';
const failSpan = PROG.spans.find(s => s.agent === PRAGUE && s.label === 'search_hotels');              // ends at the 503 failure
const alertEv = PROG.events.find(e => e.kind === 'alert');
const instrEv = PROG.events.find(e => e.kind === 'instruction');
const lastCall = PROG.spans.filter(s => s.agent === PRAGUE && s.kind === 'llm').slice(-1)[0];          // Prague's last model call
const pragueDone = PROG.events.filter(e => e.kind === 'result' && e.from === PRAGUE).slice(-1)[0];
function lostScene(now) {
  const P = {lanes: L3Y};
  let h = txt(12, 18, 'A third run: helpers report progress', {h: 1, z: 18, a: 'start'});
  h += laneLabels(PROG, P) + grid(P, X3, [20, 40, 60]);
  h += bars(PROG, now, P, X3, {failed: s => s === failSpan && now >= failSpan.end,
    msgColor: e => e === alertEv || e === instrEv ? C.red : C.blue});
  if (now >= failSpan.end) h += txt(X3(failSpan.end) + 3, L3Y[3] - 9, '✗', {a: 'start', z: 14, c: 'red', w: 700});
  if (now >= instrEv.t) {   // the reply lands inside a model call that had already started
    const x0 = X3(lastCall.start), x1 = X3(lastCall.end);
    h += `<rect x="${x0 - 2}" y="${L3Y[3] - BH / 2 - 3}" width="${x1 - x0 + 4}" height="${BH + 6}" rx="3" fill="none" stroke="${C.red}" stroke-dasharray="3 2" stroke-width="1.2"/>`;
    h += txt(X3(instrEv.t), L3Y[3] + 4.5, '✗', {z: 14, c: 'ink', w: 700});
  }
  if (now < PROG.wall_s) h += nowLine(P, X3, now);
  else h += txt(X3(PROG.wall_s) + 4, L3Y[0] + 4.5, '✓', {a: 'start', z: 13, c: 'green'});
  h += axis(X3, [0, 20, 40, 60], AX3, ' s');
  const lines = [
    [failSpan.end, s1(failSpan.end) + ' s  ✗ Prague’s hotel search fails (HTTP 503)', 'ink'],
    [alertEv.t, s1(alertEv.t) + ' s  Prague sends the planner an urgent report', 'ink'],
    [instrEv.t, s1(instrEv.t) + ' s  Planner replies: go ahead with the backup', 'ink'],
    [instrEv.t + 1.2, '✗ Never read: Prague’s last model call had', 'red'],
    [instrEv.t + 1.2, '   begun at ' + s1(lastCall.start) + ' s, and no one told the planner', 'red'],
    [pragueDone.t, s1(pragueDone.t) + ' s  Prague answers anyway; trip still correct', 'mut'],
  ];
  lines.forEach(([at, s, c], i) => { if (now >= at) h += txt(12, 182 + i * 20, s, {a: 'start', z: 13, c}); });
  return h;
}

/* ---- all seven runs: planner working vs waiting, from comparison.csv */
const NAMES = {'0 single agent': 'One agent', '1 sync handoff': 'Sync handoff', '2 async spawn': 'Async spawn', '3 progress + redirect': 'Progress reports',
  '4 child asks parent': 'Child asks parent', '6 nested': 'Nested helpers', '5 race + cancel': 'Race (flights)'};
const ORDER = ['0 single agent', '1 sync handoff', '2 async spawn', '3 progress + redirect', '4 child asks parent', '6 nested', '5 race + cancel'];
const XB = s => 132 + s * 1.6;
function allRuns(k) {   // k: 0..1 growth of the bars
  let h = txt(12, 18, 'Finish time, one recorded run each', {h: 1, z: 18, a: 'start'});
  ORDER.forEach((lv, i) => {
    const r = DATA.comparison.find(c => c.level === lv), y = 44 + i * 24, w = r['wall s'] * k, b = r['main blocked s'] * k;
    const race = lv.startsWith('5');
    h += txt(12, y + 4.5, NAMES[lv], {a: 'start', z: 13, c: race ? 'mut' : 'ink'});
    h += `<rect x="${XB(0)}" y="${y - 6}" width="${Math.max(0, XB(w - b) - XB(0))}" height="12" rx="2" fill="${C.mut}" opacity="${race ? .5 : .9}"/>`;
    if (b > 0) h += `<rect x="${XB(w - b)}" y="${y - 6}" width="${XB(w) - XB(w - b)}" height="12" fill="url(#hatch)" stroke="${C.fill.amber}" stroke-width=".9"/>`;
    if (k >= 1) h += txt(XB(w) + 5, y + 4.5, Math.round(r['wall s']) + ' s', {a: 'start', z: 13, c: lv.startsWith('1') ? 'amber' : race ? 'mut' : 'ink'});
  });
  if (k >= 1) {
    const ok = DATA.comparison.filter(c => c.correct === 'True').length;
    h += txt(12, 212, 'Grey: planner working. Hatched: planner waiting.', {a: 'start', z: 13, c: 'ink'});
    h += txt(12, 236, `All ${ok} answers correct: correctness can’t rank them.`, {a: 'start', z: 13, c: 'mut'});
    h += txt(12, 258, 'One run each; a few seconds may not repeat.', {a: 'start', z: 13, c: 'mut'});
    h += txt(12, 280, 'Race planned flights only: not comparable.', {a: 'start', z: 13, c: 'mut'});
  }
  return h;
}

/* ---- event log, generated from the recorded events */
function runLog(run, t0, sp, label) {
  const nm = cities(run), L = [{t: t0 + 1, text: '• ' + label, c: 'mut'}];
  const say = {spawn: e => `→ ${s1(e.t)} s planner → ${nm[e.to]} helper: start`, result: e => `← ${s1(e.t)} s ${nm[e.from]} helper answers`,
    progress: e => `• ${s1(e.t)} s ${nm[e.from]} sends a progress note`, alert: e => `✗ ${s1(e.t)} s ${nm[e.from]}: search failed (503)`,
    instruction: e => `→ ${s1(e.t)} s planner → ${nm[e.to]}: use backup`};
  run.events.forEach(e => L.push({t: t0 + e.t * sp, text: say[e.kind] ? say[e.kind](e) : e.kind, c: e.kind === 'alert' || e.kind === 'instruction' ? 'red' : e.kind === 'result' ? 'blue' : 'ink'}));
  blockedSpans(run).forEach(b => L.push({t: t0 + b.end * sp + 1, text: `• ${s1(b.end)} s planner resumes after ${s1(b.end - b.start)} s wait`, c: 'amber'}));
  const fl = run.spans.find(s => s.agent === 'main' && s.label === 'search_flights');
  if (fl) L.push({t: t0 + fl.start * sp, text: `→ ${s1(fl.start)} s planner starts flight searches`, c: 'green'});
  L.push({t: t0 + run.wall_s * sp, text: `✓ ${s1(run.wall_s)} s final answer (correct)`, c: 'green'});
  return L.sort((a, b) => a.t - b.t);
}
const LOG = [{t: 0, text: '• trip: Toronto → Lisbon → Rome → Prague → home', c: 'mut'}]
  .concat(runLog(SYNC, T1, SP, 'sync handoff run'), runLog(ASYNC, T2, SP, 'async spawn run'))
  .concat([{t: T3 + 1, text: '• finish = own work + waiting', c: 'mut'}])
  .concat(runLog(PROG, T4, SP3, 'progress report run (5× slower)'))
  .concat([{t: T4 + (instrEv.t + 1.2) * SP3, text: `✗ reply never read (last call began ${s1(lastCall.start)} s)`, c: 'red'},
           {t: T5 + 1, text: '• all seven runs', c: 'mut'}])
  .sort((a, b) => a.t - b.t);

K.player({
  root: '#x', style: 'chalkboard', viewBox: [380, 300], duration: D,
  title: 'Replay of two recorded runs from notebook 07: a planner agent that hands each city to a helper and waits finishes in 120 s; one that starts all helpers and keeps working finishes in 57 s. A third run shows a reply that arrived too late to be read.',
  legend: [
    {key: 'llm', label: 'Model call', color: 'fill.violet'},
    {key: 'tool', label: 'Search (flights, hotel, weather)', color: 'fill.green'},
    {key: 'wait', label: 'Planner waiting for a helper', color: 'fill.amber'},
    {key: 'msg', label: 'Message between agents', color: 'blue'},
    {key: 'err', label: 'Failure or lost message', color: 'red'},
  ],
  chapters: [
    {at: T0, title: 'Meet the cast',
     cap: 'A planner model splits a 3-city trip. One helper per city finds a hotel and the weather; the planner searches flights itself. Bars will be model calls and searches from two recorded runs.'},
    {at: T1, title: 'Sync: hand off, wait',
     cap: 'The planner hands one city to a helper and stops until it answers. Hatched bars are the planner waiting: 25.0, 21.3 and 20.0 s. It gets back to its own work only at 83 s.'},
    {at: T2, title: 'Async: start all, go on',
     cap: 'Same task, same helpers. The planner starts all three, then searches flights while they work. Answers arrive at 25, 31 and 35 s, before it asks for them. It never waits.'},
    {at: T3, title: 'Who waited for whom',
     cap: 'Finish time = the planner’s own work + its waiting. Both planners worked 54-57 s. Sync added 66.3 s of waiting for helpers; async added none, so it finished in 57 s, not 120 s.'},
    {at: T4, title: 'The reply nobody read',
     cap: 'A third run (slowed to 5×). Prague’s hotel search fails and it alerts the planner. The planner’s reply lands after Prague’s last model call began, so it is never read.'},
    {at: T5, title: 'All seven runs',
     cap: 'Start helpers and keep the planner busy; wait only when you need an answer. Sync handoff was the one pattern slower than a single agent (120 s vs 82 s). Check that late messages get read.'},
  ],
  log: LOG,
  clock: t => t < T1 ? 'ready' : t < T2 ? s1(Math.min((t - T1) / SP, SYNC.wall_s)) + ' s · 10×' : t < T3 ? s1(Math.min((t - T2) / SP, ASYNC.wall_s)) + ' s · 10×'
    : t < T4 ? 'both done' : t < T5 ? s1(Math.min((t - T4) / SP3, PROG.wall_s)) + ' s · 5×' : 'all runs',
  scene: () => `<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="${C.fill.amber}" fill-opacity=".22"/><rect width="2" height="5" fill="${C.fill.amber}"/></pattern></defs>`,
  frame(t, s) {
    let h = '';
    if (t < T4) {
      const nA = t < T1 ? 0 : Math.min((t - T1) / SP, SYNC.wall_s + .01);
      const nB = t < T2 ? 0 : Math.min((t - T2) / SP, ASYNC.wall_s + .01);
      const cmp = t >= T3, beat2 = t >= T3 + 2500;
      h += panel(SYNC, nA, PA, 'Sync handoff', {dim: t >= T2 && t < T3, sum: cmp ? sumLine(SYNC, PA) : null});
      h += panel(ASYNC, nB, PB, 'Async spawn', {dim: t < T2, sum: cmp && beat2 ? sumLine(ASYNC, PB) : null});
      if (t < T1) {   // the cast: say who is who before anything moves
        h += txt(76, PA.sum, 'Planner: Sonnet 5.5 · helpers: Haiku 5.5', {a: 'start', z: 13, c: 'mut'});
        h += txt(76, PB.sum, 'Same task; only the hand-off differs', {a: 'start', z: 13, c: 'mut'});
      }
      if (cmp && beat2) {   // the async finish time marked inside the sync panel
        const xa = X(ASYNC.wall_s);
        h += `<line x1="${xa}" x2="${xa}" y1="${PA.lanes[3] + 8}" y2="${PA.lanes[0] - 8}" stroke="${C.green}" stroke-dasharray="3 3" stroke-width="1"/>`;
      }
      h += axis(X, [0, 30, 60, 90, 120], AXIS, ' s');
    } else if (t < T5) {
      h += lostScene(Math.min((t - T4) / SP3, PROG.wall_s + .01));
    } else {
      h += allRuns(clamp((t - T5) / 1800));
    }
    s.dyn.innerHTML = h;
  },
});

</script>
</body></html>
