  [0, 10, 20].forEach((v, i) => { m += `<line x1="44" x2="356" y1="${CY(v)}" y2="${CY(v)}" stroke="${C.line}" stroke-width="${v ? .6 : 1.2}" stroke-dasharray="${v ? '2 4' : ''}"/>` + T(38, CY(v) + 4, String(v), {z: 12, c: 'mut', a: 'end', t: 100 + i * 60}); });
  [0, .5, 1].forEach((v, i) => { m += T(CX(v), 175, pc(v), {z: 12, c: 'mut', a: v === 0 ? 'start' : v === 1 ? 'end' : 'middle', t: 200 + i * 60}); });
  m += T(200, 192, xTitle, {z: 12.5, c: 'ink', t: 300}) + extra;
  // concrete view: 100 attempts per rule, one column per group, first try on top
  m += T(16, 214, 'Always 4', {h: 1, z: 17, c: 'violet', a: 'start', t: 500}) + T(368, 214, '', {id: 'uLab', z: 12.5, a: 'end', t: 500})
     + T(16, 271, 'Stop if 2 agree', {h: 1, z: 17, c: 'green', a: 'start', t: 650}) + T(368, 271, '', {id: 'aLab', z: 12.5, a: 'end', t: 650})
     + T(16, 330, '', {id: 'trade', z: 12.5, c: 'ink', a: 'start', t: 900})
     + T(16, 356, '', {id: 'verdict', h: 1, z: 19, c: 'ink', a: 'start', t: 1100})
     + T(16, 380, 'Dots: 100 attempts per rule, groups rounded', {z: 12, c: 'mut', a: 'start', t: 1200});
  return m;
}
function chartLayer(s) {
  const g = s.el('g', {});
  const uP = s.el('path', {fill: 'none', stroke: col('violet'), 'stroke-width': 2.4, 'stroke-linejoin': 'round'}, g);
  const aP = s.el('path', {fill: 'none', stroke: col('green'), 'stroke-width': 2.4, 'stroke-linejoin': 'round', 'stroke-dasharray': '7 3'}, g);
  const mk = s.el('line', {y1: 34, y2: 160, stroke: col('ink'), 'stroke-width': 1, 'stroke-dasharray': '3 3', 'stroke-opacity': .6}, g);
  const uD = s.el('circle', {r: 4, fill: col('violet')}, g), aD = s.el('circle', {r: 4, fill: col('green')}, g);
  const tx = c => { const t = s.el('text', {'font-size': 12.5, fill: col(c), style: 'font-family:var(--font-sans,system-ui,sans-serif);font-variant-numeric:tabular-nums;font-weight:600'}, g); return t; };
  const uT = tx('violet'), aT = tx('green');
  const rows = [0, 1].map(k => { const rg = s.el('g', {}); return {g: rg, dots: Array.from({length: 200}, () => s.el('circle', {r: 2.6, cx: -20, cy: -20}, rg))}; });
  return {g, uP, aP, mk, uD, aD, uT, aT, rows};
}
const path = (xs, fn) => 'M' + xs.map(x => `${CX(x).toFixed(1)} ${CY(fn(x)).toFixed(1)}`).join(' L');
// fill one row of dots: groups = [{n, fill}], one column per group, first try on top
function fillRow(row, groups, yTop) {
  let j = 0, col0 = 0;
  groups.forEach(gp => { for (let k = 0; k < gp.n; k++) { const d = row.dots[j++]; d.setAttribute('cx', 18 + col0 * 7); d.setAttribute('cy', yTop + k * 6.6); d.setAttribute('fill', col(gp.fill)); d.style.opacity = 1; } col0++; });
  for (; j < row.dots.length; j++) row.dots[j].style.opacity = 0;
}
function drawConcrete(L, m) {
  const mu = Math.round(m.uni), ma = Math.round(m.ada), st = Math.max(0, Math.round((100 - 4 * ma) / 2));
  fillRow(L.rows[0], [...Array(mu).fill({n: 4, fill: 'fill.blue'}), ...Array(25 - mu).fill({n: 4, fill: 'faint'})], 223);
  fillRow(L.rows[1], [...Array(ma).fill({n: 4, fill: 'fill.blue'}), ...Array(st).fill({n: 2, fill: 'fill.amber'})], 280);
}
function setVals(L, x, m) {
  const X = CX(x), yu = CY(m.uni), ya = CY(m.ada);
  L.mk.setAttribute('x1', X); L.mk.setAttribute('x2', X);
  L.uD.setAttribute('cx', X); L.uD.setAttribute('cy', yu); L.aD.setAttribute('cx', X); L.aD.setAttribute('cy', ya);
  const right = X < 250, tx = right ? X + 8 : X - 8, anc = right ? 'start' : 'end';
  let upY = Math.min(yu, ya) - 6, loY = Math.max(yu, ya) + 15;
  if (loY - upY < 14) loY = upY + 14;
  if (loY > 156) { loY = 156; upY = Math.min(upY, loY - 14); }
  const uTop = m.uni >= m.ada;
  [[L.uT, uTop ? upY : loY, m.uni], [L.aT, uTop ? loY : upY, m.ada]].forEach(([t, y, v]) => { t.setAttribute('x', tx); t.setAttribute('y', y); t.setAttribute('text-anchor', anc); t.textContent = f1(v); });
}
function setTexts(s, m) {
  s.q('#uLab').textContent = `25 groups, ${f1(m.uni)} mixed`;
  s.q('#aLab').textContent = `${f1(m.G)} groups, ${f1(m.ada)} mixed`;
  s.q('#trade').textContent = `${f1(m.stopped)} pairs stopped; ${f1(m.lost)} would have turned mixed`;
  const d = m.ada - m.uni;
  s.q('#verdict').textContent = Math.abs(d) < .05 ? `About even: ${f1(m.uni)} mixed groups each`
    : d < 0 ? `Always 4 collects more: ${f1(m.uni)} vs ${f1(m.ada)}` : `Stopping collects more: ${f1(m.ada)} vs ${f1(m.uni)}`;
}
function knob(s, o) {
  const k = K.slider(s.act, o);
  k.input.addEventListener('input', ev => { if (ev.isTrusted) s.touched(); });
  return k;
}
async function sweep(s, k, from, to, ms) { const n = Math.max(2, Math.round(ms / 40)); for (let i = 0; i <= n; i++) { k.set(+(from + (to - from) * i / n).toFixed(2)); await s.wait(40); } }
const PS = Array.from({length: 97}, (_, i) => .02 + i * .01);
const ES = Array.from({length: 101}, (_, i) => i / 100);
const solRate = DATA.solTokens.successes / DATA.solTokens.known;

K.stepper({
  root: '#x', style: 'chalkboard', viewBox: [380, 400],
  title: 'An explorable model of a stopping rule for collecting training attempts: making two tries per task and stopping when they agree, against always making four, with the measured result from notebook 27.',
  actHeight: 128, hold: 2600,
  legend: [
    {key: 'mix', label: 'try in a mixed group', color: 'fill.blue'},
    {key: 'same', label: 'try in a one-outcome group', color: 'faint'},
    {key: 'stop', label: 'pair stopped after 2', color: 'fill.amber'},
    {key: 'uni', label: 'always 4', color: 'violet'},
    {key: 'ada', label: 'stop if 2 agree', color: 'green'},
  ],
  steps: [
    { title: '1. Which groups teach', keys: ['mix', 'same'],
      cap: 'Training compares tries at one task: each is scored against the average of the other three. Only a group holding a success and a failure gives scores that are not zero.',
      draw() {
        const notes = [['mixed: it teaches', 'blue', 'successes +1/3, failure −1'], ['all failed', 'mut', 'nothing to compare'], ['all succeeded', 'mut', 'nothing to compare']];
        let m = '';
        DATA.examples.forEach((ex, i) => {
          const y = 70 + i * 100, t0 = 200 + i * 700, mixed = isMixed(ex.r);
          m += T(16, y - 26, `Sol, ${ex.task} (${ex.set})`, {z: 12, c: 'mut', a: 'start', t: t0});
          ex.r.forEach((r, k) => { m += bigDot(36 + k * 32, y, r, mixed ? 'fill.blue' : 'faint', t0 + 120 + k * 110, 11 + i * 4 + k);
            m += T(36 + k * 32, y + 28, scoreTxt(looScore(ex.r, k)), {z: 12, c: mixed ? 'blue' : 'mut', t: t0 + 600}); });
          m += T(180, y + 2, notes[i][0], {h: 1, z: 19, c: notes[i][1], a: 'start', t: t0 + 500}) + T(180, y + 20, notes[i][2], {z: 12, c: 'mut', a: 'start', t: t0 + 560});
        });
        m += T(16, 352, 'Score under each try = it minus the', {z: 12.5, c: 'ink', a: 'start', t: 2600}) + T(16, 370, 'average of the other three (✓ = 1, ✗ = 0)', {z: 12.5, c: 'ink', a: 'start', t: 2650});
        return m;
      }, duration: 3300 },

    { title: '2. Two ways to collect', keys: ['mix', 'stop', 'uni', 'ada'],
      cap: 'Always 4 spends four tries per task. The stop rule makes two and adds two only if they disagree. It saves tries, but a stopped pair can hide a task that sometimes succeeds.',
      draw() {
        let m = '';
        // frontier_v6/groups.csv: uniform token6r-16 [0,1,0,0]; adaptive token6r-16 [0,0] stopped; adaptive token6r-03 [0,1,0,0]
        const rows = [
          {name: 'Always 4', c: 'violet', task: 'token6r-16', r: [0, 1, 0, 0], note: 'mixed: counts', sub: '4 tries, no matter what'},
          {name: 'Stop if 2 agree', c: 'green', task: 'token6r-16', r: [0, 0], note: '2 agree: stop', sub: '2 tries kept for a new task'},
          {name: 'Stop if 2 agree', c: 'green', task: 'token6r-03', r: [0, 1, 0, 0], note: 'disagree: 2 more', sub: 'mixed: counts'},
        ];
        rows.forEach((rw, i) => {
          const y = 66 + i * 100, t0 = 200 + i * 1100;
          m += T(16, y - 28, rw.name, {h: 1, z: 17, c: rw.c, a: 'start', t: t0}) + T(368, y - 28, 'Sol, ' + rw.task, {z: 12, c: 'mut', a: 'end', t: t0});
          rw.r.forEach((r, k) => { m += bigDot(36 + k * 32, y, r, rw.r.length === 2 ? 'fill.amber' : 'fill.blue', t0 + 200 + k * 220 + (k >= 2 ? 300 : 0), 40 + i * 4 + k); });
          if (rw.r.length === 2) [2, 3].forEach(k => { m += P(ellipse(36 + k * 32, y, 10, 10, 60 + k), 'faint', t0 + 800, 300, 1.2, 'stroke-dasharray="2 3"'); });
          m += T(180, y + 2, rw.note, {h: 1, z: 19, c: rw.r.length === 2 ? 'amber' : 'blue', a: 'start', t: t0 + 900}) + T(180, y + 20, rw.sub, {z: 12, c: 'mut', a: 'start', t: t0 + 950});
        });
        m += T(16, 352, 'Same task, separate tries: the stopped pair saw', {z: 12.5, c: 'ink', a: 'start', t: 3700})
           + T(16, 370, 'only failures; always-4 found a success.', {z: 12.5, c: 'ink', a: 'start', t: 3750});
        return m;
      }, duration: 4400 },

    { title: '3. Same rate on every task', keys: ['mix', 'same', 'stop', 'uni', 'ada'],
      cap: 'Suppose every task has the same success rate. Drag it. Always 4 collects more mixed groups at every rate: the pairs it would have stopped often turn mixed with two more tries.',
      draw: () => chartFrame('success rate, the same on every task',
        `<line x1="${CX(solRate)}" x2="${CX(solRate)}" y1="160" y2="166" stroke="${C.blue}" stroke-width="1.5"/>` + T(CX(solRate) + 4, 175, 'Sol 27%', {z: 12, c: 'blue', a: 'middle', t: 360})),
      start(s) {
        const L = chartLayer(s);
        const upd = () => { const m = model(STATE.p, 0); L.uP.setAttribute('d', path(PS, p => model(p, 0).uni)); L.aP.setAttribute('d', path(PS, p => model(p, 0).ada));
          setVals(L, STATE.p, m); drawConcrete(L, m); setTexts(s, m); };
        L.g.style.opacity = 0; L.rows.forEach(r => r.g.style.opacity = 0);
        s.at(500, () => { s.drawIn(L.uP, 900); s.drawIn(L.aP, 900, 200); s.fadeIn(L.g, 300); });
        s.at(900, () => L.rows.forEach((r, k) => s.fadeIn(r.g, 500, k * 200)));
        s.k = knob(s, {label: 'Success rate on each task', min: .02, max: .98, step: .01, value: STATE.p, fmt: pc, oninput: v => { STATE.p = v; upd(); }});
      },
      demo: async s => { const k = s.k; await sweep(s, k, k.value, .1, 1200); await s.wait(500); await sweep(s, k, .1, .9, 2000); await s.wait(400); await sweep(s, k, .9, .5, 1000); },
      idleDemo: 5000, demoDuration: 5600, duration: 2200 },

    { title: '4. Mix in fixed tasks', keys: ['mix', 'same', 'stop', 'uni', 'ada'],
      cap: 'Now some tasks always give the same result, and stopping saves tries on them. The lines cross only when 71 to 75% of tasks never change, and then the yield is small for both.',
      draw: () => chartFrame('share of tasks that always give the same result',
        `<g id="flipG"><circle id="flipC" r="4.5" fill="none" stroke="${C.ink}" stroke-width="1.6"/>` + T(0, 0, '', {id: 'flipT', z: 12, c: 'ink', a: 'end', t: 400}) + '</g>'),
      start(s) {
        const L = chartLayer(s);
        const upd = () => { const p = STATE.p, m = model(p, STATE.e);
          L.uP.setAttribute('d', path(ES, e => model(p, e).uni)); L.aP.setAttribute('d', path(ES, e => model(p, e).ada));
          const fe = m.flip, fy = CY(model(p, fe).uni);
          s.q('#flipC').setAttribute('cx', CX(fe)); s.q('#flipC').setAttribute('cy', fy);
          const ft = s.q('#flipT'); ft.setAttribute('x', CX(fe) - 8); ft.setAttribute('y', 152); ft.textContent = `cross at ${pc(fe)}`;
          setVals(L, STATE.e, m); drawConcrete(L, m); setTexts(s, m); };
        L.g.style.opacity = 0; L.rows.forEach(r => r.g.style.opacity = 0);
        s.at(500, () => { s.drawIn(L.uP, 900); s.drawIn(L.aP, 900, 200); s.fadeIn(L.g, 300); });
        s.at(900, () => L.rows.forEach((r, k) => s.fadeIn(r.g, 500, k * 200)));
        s.kp = knob(s, {label: 'Success rate on the other tasks', min: .02, max: .98, step: .01, value: STATE.p, fmt: pc, oninput: v => { STATE.p = v; upd(); }});
        s.ke = knob(s, {label: 'Tasks that always give the same result', min: 0, max: .95, step: .01, value: STATE.e, fmt: pc, oninput: v => { STATE.e = v; upd(); }});
      },
      demo: async s => { const k = s.ke; await sweep(s, k, k.value, .72, 2200); await s.wait(900); await sweep(s, k, .72, .9, 800); await s.wait(700); await sweep(s, k, .9, 0, 1200); },
      idleDemo: 5000, demoDuration: 6200, duration: 2200 },

    { title: '5. What Sol really did', keys: ['mix', 'same', 'stop', 'uni', 'ada'],
      cap: 'Measured at 24M tokens per rule: 4 mixed groups each. The tasks decided the yield, so find tasks the model sometimes fails before tuning a stopping rule.',
      draw() {
        let m = T(16, 20, 'Sol, 16 hard calendar tasks, equal tokens (measured)', {z: 12.5, c: 'mut', a: 'start'});
        const rowsD = [{name: 'Always 4', c: 'violet', gs: DATA.solUniform, y: 62}, {name: 'Stop if 2 agree', c: 'green', gs: DATA.solAdaptive, y: 168}];
        rowsD.forEach((rw, i) => {
          const mixed = rw.gs.filter(isMixed).length, t0 = 200 + i * 1500;
          m += T(16, rw.y - 18, rw.name, {h: 1, z: 17, c: rw.c, a: 'start', t: t0}) + T(368, rw.y - 18, `${mixed} mixed, ${rw.gs.length} tasks reached`, {z: 12.5, a: 'end', t: t0});
          rw.gs.forEach((g, gi) => {
            const fill = isMixed(g) ? 'fill.blue' : (g.length === 2 && g.every(v => v != null)) ? 'fill.amber' : 'faint';
            g.forEach((r, k) => { m += bigDot(26 + gi * 24.6, rw.y + k * 21, r, fill, t0 + 150 + gi * 80 + k * 30, 100 + i * 60 + gi * 4 + k, 9); });
          });
        });
        const mU = DATA.solUniform.filter(isMixed).length, mA = DATA.solAdaptive.filter(isMixed).length;
        const nStop = DATA.solAdaptive.filter(g => g.length === 2 && g.every(v => v != null)).length;
        m += T(16, 278, `${mU} and ${mA} mixed groups: a tie`, {h: 1, z: 21, c: 'ink', a: 'start', t: 3400})
           + T(16, 300, `${nStop} pairs stopped, every one on two failures`, {z: 12.5, a: 'start', t: 3700})
           + T(16, 318, `${DATA.extraTasks.tasks} extra tasks reached: ${DATA.extraTasks.successes} successes in ${DATA.extraTasks.known} tries`, {z: 12.5, a: 'start', t: 3850})
           + T(16, 336, '? = cut off when the budget ran out; not counted', {z: 12, c: 'mut', a: 'start', t: 4000})
           + T(16, 364, `Easier task sets: Sol solved ${DATA.solCeiling.solved} of ${DATA.solCeiling.known} tries,`, {z: 12.5, c: 'amber', a: 'start', t: 4300})
           + T(16, 382, 'so neither rule could find one mixed group', {z: 12.5, c: 'amber', a: 'start', t: 4400});
        return m;
      }, duration: 5000 },
  ],
});
