    const y = by + 38 + i * 16;

    m += T(bx + bw - 8, y, money(v), {a: 'end', t: tt(350 + i * 110), d: dd(400)});
  });
  m += P(line(bx + 8, by + 128, bx + bw - 8, by + 128, 2, 0), 'mut', tt(1100), dd(300), 1);
  m += T(bx + 8, by + 143, 'Profit', {a: 'start', c: 'green', w: 600, t: tt(1300), d: dd(400)});
  m += T(bx + bw - 8, by + 143, money(sumBooks), {a: 'end', c: 'green', w: 600, t: tt(1300), d: dd(400), id: 'keyProfit'});
  // model
  const [mx, my, mw, mh] = G.model, mname = o.model === 'q' ? ['Qwen3.8', 'Flash'] : ['Gemma 4', '31B'];
  m += `<g id="model">` + P(rect(mx, my, mw, mh, 3), 'violet', tt(500), dd(600), 1.8);
  m += T(mx + mw / 2, my + 24, mname[0], {c: 'violet', z: 13, w: 600, t: tt(800), d: dd(400)});
  m += T(mx + mw / 2, my + 40, mname[1], {c: 'violet', z: 13, w: 600, t: tt(800), d: dd(400)});
  m += `<text id="msub" x="${mx + mw / 2}" y="${my + 56}" text-anchor="middle" font-size="12" fill="${C.mut}" style="font-family:var(--font-sans,system-ui,sans-serif);font-variant-numeric:tabular-nums">${o.msub || 'the model'}</text></g>`;
  // connectors
  m += P(poly(G.pPrompt, 4), 'mut', tt(900), dd(250)) + P(arrow(124, 102, 139, 102, 5, 5), 'mut', tt(1100), dd(120));
  m += P(poly(G.pOut, 6), 'mut', tt(900), dd(250)) + P(arrow(224, 102, 239, 102, 7, 5), 'mut', tt(1100), dd(120));
  // workpaper
  const [wx, wy, ww, wh] = G.wp;
  m += P(rect(wx, wy, ww, wh, 8), 'line', tt(300), dd(600));
  m += T(wx + 8, wy + 18, 'Workpaper', {h: 1, z: 16, a: 'start', t: tt(600), d: dd(450)});
  ['Profit', 'Owner A', 'Owner B', '6 other fields'].forEach((lab, i) => {
    m += T(wx + 8, wy + 40 + i * 18, lab, {a: 'start', c: 'mut', t: tt(700 + i * 100), d: dd(400)});
  });
  const W = o.wp === 'g' ? DATA.gemma : o.wp === 'q' ? DATA.qwen : null;
  const val = (k, i) => {
    const y = wy + 40 + i * 18;
    if (!W) return o.wp === 'hidden' ? hid(wx + ww - 8, y, '', {id: 'wv' + i, a: 'end'}) : T(wx + ww - 8, y, '?', {a: 'end', c: 'faint', t: tt(1000), d: dd(400), id: 'wv' + i});
    const ok = W[k] === DATA.key[k];
    return T(wx + ww - 8, y, money(W[k]) + (ok ? ' ✓' : ' ✗'), {a: 'end', c: ok ? 'green' : 'red', w: 600, id: 'wv' + i});
  };
  m += val('profit', 0) + val('A', 1) + val('B', 2);
  if (W) m += T(wx + ww - 8, wy + 94, '✓', {a: 'end', c: 'green', w: 600, id: 'wv3'});
  else m += o.wp === 'hidden' ? hid(wx + ww - 8, wy + 94, '✓', {id: 'wv3', a: 'end', c: 'green', w: 600}) : '';
  m += P(line(wx + 8, wy + 106, wx + ww - 8, wy + 106, 9, 0), 'faint', tt(900), dd(300), 1);
  if (W) m += T(wx + 8, wy + 126, W.right + ' of 9 right', {a: 'start', c: W.right === 9 ? 'green' : 'red', z: 13, w: 600, id: 'verdict'}) +
              T(wx + 8, wy + 142, W.right === 9 ? 'fully correct' : 'not fully correct', {a: 'start', c: W.right === 9 ? 'green' : 'red', id: 'verdict2'});
  else m += hid(wx + 8, wy + 126, '', {id: 'verdict', z: 13, w: 600}) + hid(wx + 8, wy + 142, '', {id: 'verdict2'}) +
            (o.wp === 'empty' ? T(wx + 8, wy + 126, 'all 9 must match', {a: 'start', c: 'mut', t: tt(1500), d: dd(400)}) +
                                T(wx + 8, wy + 142, 'the answer key', {a: 'start', c: 'mut', t: tt(1500), d: dd(400)}) : '');
  // add-on 1: checklist
  const [lx, ly, lw, lh] = G.list;
  m += `<g id="gList" ${dim('list')}>` + P(rect(lx, ly, lw, lh, 10), 'blue', tt(1600), dd(500)) +
       T(lx + 8, ly + 18, 'Checklist', {h: 1, z: 15, a: 'start', c: 'blue', t: tt(1800), d: dd(400)}) +
       T(lx + 8, ly + 36, '+868 characters', {a: 'start', c: 'mut', t: tt(1800), d: dd(400)}) +
       P(poly(G.pList, 11), 'blue', tt(1900), dd(400), 1.2) + P(arrow(152, 160, 152, 135, 12, 5), 'blue', tt(2250), dd(120), 1.2) + `</g>`;
  // add-on 2: self-review loop
  m += `<g id="gReview" ${dim('review')}>` + P(poly(G.pReview, 13), 'blue', tt(2000), dd(400), 1.2) +
       P(arrow(200, 160, 200, 135, 14, 5), 'blue', tt(2350), dd(120), 1.2) +
       T(220, 180, 'review', {c: 'blue', t: tt(2200), d: dd(400)}) + `</g>`;
  // add-on 3: checker
  const [cx, cy, cw, ch] = G.chk;
  m += `<g id="gChk" ${dim('chk')}>` + P(rect(cx, cy, cw, ch, 15), 'amber', tt(2100), dd(500)) +
       T(cx + 8, cy + 17, 'Checker', {h: 1, z: 15, a: 'start', c: 'amber', t: tt(2300), d: dd(400)});
  ['format', 'tax year', 'sources', 'A + B = profit'].forEach((lab, i) => {
    m += T(cx + 8, cy + 34 + i * 14, lab, {a: 'start', c: 'mut', t: tt(2350 + i * 60), d: dd(300)});
    m += hid(cx + cw - 8, cy + 34 + i * 14, '✓', {id: 'ck' + i, a: 'end', c: 'green', w: 600});
  });
  m += T(cx + 8, cy + 90, 'no profit recheck', {a: 'start', c: 'red', t: tt(2600), d: dd(300), id: 'nocheck'});
  m += P(poly(G.pToChk, 16), 'amber', tt(2400), dd(200), 1.2) +
       P(poly(G.pChkBack, 17), 'amber', tt(2500), dd(500), 1.2) + P(arrow(176, 160, 176, 135, 18, 5), 'amber', tt(2950), dd(120), 1.2) + `</g>`;
  // event log (two lines)
  m += hid(14, 278, '', {id: 'log1', c: 'ink'}) + hid(14, 295, '', {id: 'log2', c: 'mut'});
  // tracker
  m += P(line(12, 312, 368, 312, 19, 0), 'faint', tt(2600), dd(500), 1);
  m += T(12, 330, 'test-01, setup by setup', {h: 1, z: 15, a: 'start', t: tt(2700), d: dd(400)});
  m += T(368, 330, 'key ' + money(DATA.key.profit), {a: 'end', c: 'green', t: tt(2700), d: dd(400)});
  m += T(150, 347, 'calls', {c: 'mut', t: tt(2800), d: dd(400)}) +
       T(266, 347, 'Gemma', {a: 'end', c: 'mut', t: tt(2800), d: dd(400)}) +
       T(360, 347, 'Qwen', {a: 'end', c: 'mut', t: tt(2800), d: dd(400)});
  DATA.rows.forEach((r, i) => {
    const y = G.rowY[i], cur = o.cur === i;
    if (cur) m += `<rect x="12" y="${y - 12}" width="356" height="16" rx="3" fill="${C.violet}" fill-opacity=".14"/>`;
    m += T(20, y, r.name, {a: 'start', c: cur ? 'ink' : 'mut', w: cur ? 600 : 400, t: tt(2900 + i * 80), d: dd(400)});
    const gDone = (o.done || 0) > i, qDone = !!o.qdone;
    m += gDone ? T(150, y, r.calls, {}) + T(266, y, money(DATA.gemma.profit) + ' ✗', {a: 'end', c: 'red', w: 600})
               : hid(150, y, r.calls, {id: 'tc' + i, a: 'middle'}) + hid(266, y, money(DATA.gemma.profit) + ' ✗', {id: 'tg' + i, a: 'end', c: 'red', w: 600}) +
                 (o.cur === i ? '' : T(266, y, '·', {a: 'end', c: 'faint', t: tt(3000), d: dd(300)}));
    const qtxt = r.q === 'ok' ? money(DATA.qwen.profit) + ' ✓' : 'HTTP 400';
    m += qDone ? T(360, y, qtxt, {a: 'end', c: r.q === 'ok' ? 'green' : 'red', w: 600})
               : hid(360, y, qtxt, {id: 'tq' + i, a: 'end', c: r.q === 'ok' ? 'green' : 'red', w: 600}) +
                 (o.qrun ? '' : T(360, y, '·', {a: 'end', c: 'faint', t: tt(3000), d: dd(300)}));
  });
  return m;
}

/* small helpers used inside start() */
const ctr = r => [r[0] + r[2] / 2, r[1] + r[3] / 2];
function log(s, a, b) { s.swap('#log1', a); s.q('#log1').style.opacity = 1; if (b != null) { s.swap('#log2', b); s.q('#log2').style.opacity = 1; } }
function showRow(s, i, gem = true) { if (gem) { s.fadeIn('#tc' + i, 400); s.fadeIn('#tg' + i, 400); } }
function fillDraft(s, W) {
  [['profit', 0], ['A', 1], ['B', 2]].forEach(([k, i], j) => {
    const ok = W[k] === DATA.key[k], e = s.q('#wv' + i);
    s.at(j * 160, () => { e.textContent = money(W[k]) + (ok ? ' ✓' : ' ✗'); e.setAttribute('fill', K.col(ok ? 'green' : 'red')); e.setAttribute('font-weight', 600); s.fadeIn(e, 350); });
  });
  s.at(500, () => s.fadeIn('#wv3', 350));
  s.at(800, () => {
    const v = s.q('#verdict'), v2 = s.q('#verdict2'), good = W.right === 9;
    v.textContent = W.right + ' of 9 right'; v2.textContent = good ? 'fully correct' : 'not fully correct';
    [v, v2].forEach(e => { e.setAttribute('fill', K.col(good ? 'green' : 'red')); s.fadeIn(e, 400); });
    s.ring(G.wp[0] + 2, G.wp[1] + 26, G.wp[2] - 4, 20, good ? 'green' : 'red');
  });
}
function sameDraft(s) { s.ring(G.wp[0] + 2, G.wp[1] + 26, G.wp[2] - 4, 20, 'red'); s.float(G.wp[0] + 64, G.wp[1] + 24, 'same', 'red', 15); }

/* step 8: every run is a dot */
function board(anim) {
  let m = T(12, 26, 'All 192 runs, 12 companies each', {h: 1, z: 16, a: 'start'});
  // shape legend (colour is never the only cue)
  const lg = [['C', 'fully correct'], ['W', 'wrong'], ['E', 'empty reply'], ['X', 'not run']];
  lg.forEach(([k, lab], i) => { const x = 18 + i * 92; m += mark(k, x, 46, 0) + T(x + 9, 50, lab, {a: 'start', c: 'mut'}); });
  let t = 300;
  const block = (name, rows, y0, total) => {
    let b = T(12, y0, name, {a: 'start', w: 600, z: 13, c: 'violet', t: anim ? t : 0}) +
            T(368, y0, total, {a: 'end', w: 600, z: 13, c: total.startsWith('0') ? 'red' : 'green', t: anim ? t + 200 : 0});
    rows.forEach(([lab, sh, de], i) => {
      [[sh, 'short'], [de, 'detailed']].forEach(([str, ins], j) => {
        const y = y0 + 20 + (i * 2 + j) * 14;
        t += 90;
        if (j === 0) b += T(12, y + 4, lab, {a: 'start', c: 'ink', t: anim ? t : 0});
        b += T(98, y + 4, ins, {a: 'start', c: 'mut', t: anim ? t : 0});
        for (let c = 0; c < 12; c++) b += `<g data-k="fade" data-t="${anim ? t + c * 18 : 0}" data-d="${anim ? 300 : 1}">${mark(str[c], 166 + c * 10, y, 0)}</g>`;
        const n = [...str].filter(ch => ch === 'C').length;
        b += T(368, y + 4, str[0] === 'X' ? 'HTTP 400' : n + ' of 12', {a: 'end', c: str[0] === 'X' ? 'red' : n ? 'green' : 'red', t: anim ? t + 200 : 0});
      });
    });
    return b;
  };
  m += block('Gemma 4 31B', DATA.board.gemma, 76, '0 of 96');
  m += block('Qwen3.8 Flash', DATA.board.qwen, 214, '67 of 96');
  m += P(line(12, 350, 368, 350, 30, 0), 'faint', anim ? t : 0, 400, 1);
  m += T(12, 372, 'Gemma: profit wrong in 96 of 96.', {a: 'start', c: 'ink', t: anim ? t + 300 : 0});
  m += T(12, 390, 'No step redid the sum, so none fixed it.', {a: 'start', c: 'mut', t: anim ? t + 400 : 0});
  m += T(12, 412, 'Qwen: right whenever it replied (67 of 67).', {a: 'start', c: 'ink', t: anim ? t + 600 : 0});
  m += T(12, 430, 'One model at the top, one at the bottom:', {a: 'start', c: 'mut', t: anim ? t + 700 : 0});
  m += T(12, 446, 'this test had no room to show a gain.', {a: 'start', c: 'mut', t: anim ? t + 700 : 0});
  return m;
}
function mark(k, x, y) {
  if (k === 'C') return `<circle cx="${x}" cy="${y}" r="4" fill="${C.fill.green}"/>`;
  if (k === 'W') return `<circle cx="${x}" cy="${y}" r="4" fill="${C.mut}" fill-opacity=".55"/>`;
  if (k === 'E') return `<circle cx="${x}" cy="${y}" r="3.4" fill="none" stroke="${C.ink}" stroke-width="1.4"/>`;
  return `<path d="M${x - 3.5} ${y - 3.5}L${x + 3.5} ${y + 3.5}M${x + 3.5} ${y - 3.5}L${x - 3.5} ${y + 3.5}" stroke="${C.red}" stroke-width="1.6" stroke-linecap="round"/>`;
}

K.stepper({
  root: '#x', style: 'blueprint', viewBox: [380, 460],
  title: 'A replay of recorded runs: one fictional S-Corporation, test-01, goes through four harness setups around two models. Gemma\'s wrong profit survives every extra step; Qwen was right from the first call.',
  legend: [
    {key: 'model', label: 'Model', color: 'violet'},
    {key: 'req', label: 'Draft or request', color: 'blue'},
    {key: 'fb', label: 'Checker feedback', color: 'amber'},
    {key: 'ok', label: 'Matches answer key', color: 'green'},
    {key: 'bad', label: 'Wrong or failed', color: 'red'},
  ],
  steps: [
    { title: '1. Job and harness', keys: ['model', 'req', 'fb', 'ok'],
      cap: 'Replay of recorded runs on one fictional company, test-01. Profit: $8,100 minus $3,700 of costs = $4,400, split 60/40. A workpaper counts only if all 9 fields match.',
      draw: () => base({anim: true, wp: 'empty', on: ['list', 'review', 'chk']}),
      start(s) {
        s.at(1500, () => s.ring(G.books[0] + 2, G.books[1] + 130, G.books[2] - 4, 20, 'green'));
        s.at(3300, () => { s.q('#gList').style.opacity = .26; s.q('#gReview').style.opacity = .26; s.q('#gChk').style.opacity = .26; });
        s.at(3500, () => log(s, 'Faint parts: steps teams add', 'around the model, one at a time.'));
      },
      duration: 4400 },

    { title: '2. Direct call', keys: ['model', 'req', 'ok', 'bad'],
      cap: 'Gemma 4 31B reads the books once and writes the workpaper. Profit $3,400, which is $1,000 short, so both owner shares are wrong too. 7 of 9 fields right: not fully correct.',
      draw: () => base({wp: 'hidden', cur: 0, msub: '1 call'}),
      async start(s) {
        log(s, '→ rules + books, one request', '');
        await s.travel(G.pPrompt, 600, 'blue', {trail: false});
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.wait(500);
        await s.travel(G.pOut, 400, 'blue');
        fillDraft(s, DATA.gemma);
        s.at(900, () => { log(s, '← 168 tokens, no working shown', '✗ profit 3,400; key says 4,400'); showRow(s, 0); });
      },
      duration: 4200 },

    { title: '3. A longer checklist', keys: ['model', 'req', 'bad'],
      cap: 'Same call plus a checklist of steps, such as "Cash draws are not wage deductions". No new facts. Gemma returns the same $3,400, as it did in all 8 of its test-01 runs.',
      draw: () => base({wp: 'hidden', on: ['list'], done: 1, cur: 1, msub: '1 call'}),
      async start(s) {
        log(s, '→ rules + books + checklist', '');
        s.travel(G.pPrompt, 600, 'blue', {trail: false});
        await s.travel(G.pList, 700, 'blue');
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.wait(500);
        await s.travel(G.pOut, 400, 'blue');
        fillDraft(s, DATA.gemma);
        s.at(900, () => { log(s, '← 340,000 cents again', '✗ still 1,000 short'); showRow(s, 1); });
      },
      duration: 4400 },

    { title: '4. Self-review', keys: ['model', 'req', 'bad'],
      cap: 'The draft goes back: "Review your previous answer… correct any mistakes." One more call. The reply is identical, as in 42 of Gemma\'s 48 review runs.',
      draw: () => base({wp: 'g', on: ['review'], done: 2, cur: 2, msub: 'call 2 of 2'}),
      async start(s) {
        await s.wait(500);
        log(s, '→ "Review your previous answer"', '');
        await s.travel(G.pReview, 800, 'blue');
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.wait(600);
        await s.travel(G.pOut, 400, 'blue');
        sameDraft(s);
        s.at(500, () => { log(s, '← same JSON, word for word', '✗ 7 of 9; profit unchanged'); showRow(s, 2); });
      },
      duration: 4200 },

    { title: '5. Checker feedback', keys: ['model', 'req', 'fb', 'bad', 'ok'],
      cap: 'A program checks format, year, sources and that 2,040 + 1,360 = 3,400. All pass, so it sends back an empty list, []. It never redoes the subtraction. The draft comes back unchanged.',
      draw: () => base({wp: 'g', on: ['chk'], done: 3, cur: 3, msub: 'call 2 of 2'}),
      async start(s) {
        await s.wait(400);
        log(s, '→ draft to the checker', '');
        await s.travel(G.pToChk, 400, 'blue');
        for (let i = 0; i < 4; i++) { s.at(i * 320, () => s.fadeIn('#ck' + i, 250)); }
        await s.wait(1400);
        s.ring(G.chk[0] + 2, G.chk[1] + 78, G.chk[2] - 4, 18, 'red');
        log(s, '← checker: [] (no errors)', 'shares add up to the wrong profit');
        await s.travel(G.pChkBack, 800, 'amber');
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.wait(500);
        await s.travel(G.pOut, 400, 'blue');
        sameDraft(s);
        s.at(500, () => showRow(s, 3));
      },
      duration: 5400 },

    { title: '6. Agent framework', keys: ['model', 'req', 'fb', 'bad'],
      cap: 'Agent software lets the model call the checker as a tool, then submit. Gemma calls it, reads [] and submits $3,400. With Qwen this setup never ran: its host refused all 24 requests.',
      draw: () => base({wp: 'hidden', on: ['chk'], done: 4, cur: 4, msub: '2 calls max'}),
      async start(s) {
        log(s, '→ call 1: validate_workpaper', '(tool call, draft as argument)');
        s.travel(G.pPrompt, 500, 'blue', {trail: false});
        await s.wait(700);
        await s.travel(G.pChkBack.slice().reverse(), 800, 'violet');
        for (let i = 0; i < 4; i++) { s.at(i * 250, () => s.fadeIn('#ck' + i, 250)); }
        await s.wait(1100);
        log(s, '← Observation: []', '→ call 2: final_answer');
        await s.travel(G.pChkBack, 700, 'amber');
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.wait(400);
        await s.travel(G.pOut, 400, 'blue');
        fillDraft(s, DATA.gemma);
        s.at(900, () => showRow(s, 4));
      },
      duration: 5600 },

    { title: '7. The other model', keys: ['model', 'req', 'ok', 'bad'],
      cap: 'Qwen3.8 Flash thinks for 1,930 tokens, then writes $4,400: fully correct in one call. Extra steps had nothing to fix, cost 2.4 to 2.7 times more, and 5 of 48 second calls came back empty.',
      draw: () => base({model: 'q', wp: 'hidden', done: 5, qrun: true, msub: 'thinking'}),
      async start(s) {
        log(s, '→ rules + books, one request', '');
        await s.travel(G.pPrompt, 600, 'blue', {trail: false});
        s.ring(G.model[0], G.model[1], G.model[2], G.model[3], 'violet');
        await s.count('#msub', DATA.qwen.think, {from: 0, du: 1400, post: ' tok'});
        await s.travel(G.pOut, 400, 'blue');
        fillDraft(s, DATA.qwen);
        s.at(900, () => log(s, '✓ 9 of 9 match the answer key', '✗ agent framework: HTTP 400 x 24'));
        for (let i = 0; i < 5; i++) s.at(1100 + i * 220, () => s.fadeIn('#tq' + i, 350));
      },
      duration: 5000 },

    { title: '8. What to change', keys: ['ok', 'bad'],
      cap: 'No step turned a wrong workpaper into a right one. Gemma\'s error is a sum, and nothing rechecked it. A step helps only if it can catch the error: here, a checker that recomputes profit (not tested).',
      draw: () => board(true),
      duration: 5200 },
  ],
});
